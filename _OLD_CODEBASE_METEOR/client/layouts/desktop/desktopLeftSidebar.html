<template name="desktopLeftSidebar">
    <div id="desktopLeftSidebar" class="mt-5 mt-xl-0 ">

        {{#if isLoggedIn}}

            <div class="profile-sidebar cus-scrollbar p-5">
                <div class="d-block d-lg-none position-absolute end-0 top-0">
                    <button class="button profile-close">
                        <i class="material-symbols-outlined mat-icon fs-xl"> close </i>
                    </button>
                </div>
                <div class="profile-pic d-flex gap-2 align-items-center">
                    <div class="avatar position-relative">
                        <a href="/u/{{myUserMeta.userName}}">
                            <img class="avatar-img avatar-size" src="{{myUserMeta.avatarUrl}}" alt="avatar">
                        </a>
                    </div>
                    <div class="text-area">
                        <h6 class="m-0 mb-1"><a href="/u/{{myUserMeta.userName}}">{{myUserMeta.firstName}} {{myUserMeta.lastName}}</a></h6>
                        <p class="mdtxt"><a href="/u/{{myUserMeta.userName}}">@{{myUserMeta.userName}}</a></p>
                    </div>
                </div>
                <ul class="profile-link mt-7 mb-7 pb-7">
                    <li>
                        <a href="/" class="d-flex gap-4">
                            <i class="material-symbols-outlined mat-icon"> newspaper </i>
                            <span>News Feed</span>
                        </a>
                    </li>
                    <!-- Feature disabled: Notifications -->
                    <!--
                    <li>
                        <a href="/notifications" class="d-flex gap-4">
                            <i class="material-symbols-outlined mat-icon"> notifications </i>
                            <span>Notifications</span>
                        </a>
                    </li>
                    -->
                    <!-- Feature disabled: Messages -->
                    <!--
                    <li>
                        <a href="/messages" class="d-flex gap-4">
                            <i class="material-symbols-outlined mat-icon"> mail </i>
                            <span>Messages</span>
                        </a>
                    </li>
                    -->
                    <li>
                        <a href="/chambers" class="d-flex gap-4">
                            <i class="material-symbols-outlined mat-icon"> groups </i>
                            <span>Chambers</span>
                        </a>
                    </li>
                    <!-- Organizations removed -->
                    <!-- Feature disabled: Topics -->
                    <!--
                    <li>
                        <a href="/topics" class="d-flex gap-4">
                            <i class="material-symbols-outlined mat-icon"> tag </i>
                            <span>Topics</span>
                        </a>
                    </li>
                    -->
                    <!-- Academy removed -->
                    <!-- Feature disabled: Following -->
                    <!--
                    <li>
                        <a href="/friends" class="d-flex gap-4">
                            <i class="material-symbols-outlined mat-icon"> person </i>
                            <span>Following</span>
                        </a>
                    </li>
                    -->
                    <li>
                        <a href="/profile" class="d-flex gap-4">
                            <i class="material-symbols-outlined mat-icon"> account_circle </i>
                            <span>Profile</span>
                        </a>
                    </li>

                    <!-- Admin Settings -->
                    <hr class="mt-7 mb-7">
                    {{#if isAdmin}}
                        <li>
                            <a href="/admin/chambersBuilder" class="d-flex gap-4">
                                <i class="material-symbols-outlined mat-icon"> settings </i>
                                <span>Admin</span>
                            </a>
                        </li>
                    {{/if}}
                </ul>
            </div>
        {{else}}
                        <div class="profile-sidebar cus-scrollbar p-5">
                <div class="single-box p-4" style="background:#fff;border:1px solid #e9ecef;border-radius:12px;">
                    <div class="text-area text-start">
                                                {{#if isViewingChamber}}
                                                    <h5 class="mb-2">Welcome to Civil — {{niceName chamber}}’s Chamber of Citizens</h5>
                                                {{else}}
                                                    <h5 class="mb-2">Welcome to Civil</h5>
                                                {{/if}}
                                                <p class="mdtxt mb-4">A verified local network where real residents and businesses get things done.</p>

                        <hr class="my-4">

                        <h6 class="mb-2">Why join?</h6>
                                                <ul class="mdtxt" style="padding-left: 1.25rem;">
                                                        <li>✅ Post, comment, and vote in your Chamber of Citizens</li>
                                                        <li>✅ Get member prices from verified local businesses</li>
                                                        <li>✅ Find jobs (or hire) faster in your area</li>
                                                        <li>✅ Receive a monthly digest made for your riding</li>
                        </ul>

                        <div class="mt-4">
                                                        <div class="mdtxt mb-2">Ready to take part?</div>
                                                        <a href="/?src=guest_sidebar&utm_source=guest_panel&utm_medium=web&utm_campaign=onboarding&utm_content=variant_a" class="cmn-btn d-center gap-1 w-100 cta-join-btn" aria-label="Discover Civil">
                                                            🍁 Discover Civil
                                                        </a>
                                                        <div class="tiny-trust text-muted mt-3" style="font-size:12px;">
                                                            Reading is open.
                                                            <br />
                                                            Posting &amp; voting require verification.
                                                        </div>
                        </div>
                    </div>
                </div>
            </div>
        {{/if}}
    </div>
</template>
