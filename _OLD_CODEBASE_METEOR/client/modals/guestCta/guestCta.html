<template name="guestCtaModal">
  <div class="modal fade" id="guestCtaModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content">
        <div class="modal-header border-0 pb-0">
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body pt-0">
          <!-- Inject the same content as guest left rail -->
          <div class="text-area text-start">
            {{#if isViewingChamber}}
              <h5 class="mb-2">Welcome to Civil — {{niceName chamber}}’s Chamber of Citizens</h5>
            {{else}}
              <h5 class="mb-2">Welcome to Civil</h5>
            {{/if}}
            <p class="mdtxt mb-4">A verified local network where real residents and businesses get things done.</p>

            <h6 class="mb-2">Why join</h6>
            <ul class="mdtxt" style="padding-left: 1.25rem;">
              <li>✅ Post, comment, and vote in your Chamber of Citizens</li>
              <li>✅ Get member prices from verified local businesses</li>
              <li>✅ Find jobs (or hire) faster in your area</li>
              <li>✅ Receive a monthly digest made for your riding</li>
            </ul>

            <div class="mt-4">
              <a href="/?src=guest_sidebar&utm_source=guest_panel&utm_medium=web&utm_campaign=onboarding&utm_content=variant_a" class="cmn-btn d-center gap-1 w-100 cta-join-btn" aria-label="Discover Civil">
                🍁 Discover Civil
              </a>
              <div class="tiny-trust text-dark mt-3" style="font-size:12px;">
                Reading is open. <br />Posting &amp; voting require verification.
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
  <style>
    /* Force red brand styling for CTA buttons inside this modal */
    #guestCtaModal .cta-join-btn,
    #guestCtaModal .cmn-btn {
      background: linear-gradient(135deg, #e03131 0%, #c92a2a 100%) !important;
      color: #fff !important;
      border: none !important;
      border-radius: 12px !important;
      padding: 12px 14px !important;
      font-weight: 700 !important;
      text-align: center !important;
      box-shadow: 0 4px 10px rgba(201, 42, 42, 0.35) !important;
      transition: transform 0.12s ease, box-shadow 0.2s ease, filter 0.2s ease !important;
    }
    #guestCtaModal .cta-join-btn:hover,
    #guestCtaModal .cmn-btn:hover {
      filter: brightness(1.05);
      box-shadow: 0 6px 14px rgba(201, 42, 42, 0.45) !important;
      text-decoration: none !important;
    }
    #guestCtaModal .cta-join-btn:active,
    #guestCtaModal .cmn-btn:active { transform: translateY(1px); }
    /* Strict palette inside modal: links and text should not turn blue */
    #guestCtaModal a,
    #guestCtaModal a:link,
    #guestCtaModal a:visited,
    #guestCtaModal a:hover,
    #guestCtaModal a:active,
    #guestCtaModal a:focus {
      color: #fff !important;
      text-decoration: none !important;
      outline: none !important;
    }
    #guestCtaModal .tiny-trust,
    #guestCtaModal .tiny-trust a { color: #000000 !important; }
  </style>
</template>
