name: Deploy Civil to GKE

on:
  push:
    branches:
      - main

env:
  PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
  GAR_LOCATION: us-central1 # TODO: Make this a secret or configurable
  GAR_REPOSITORY: ${{ secrets.GAR_REPOSITORY }}
  GKE_CLUSTER: ${{ secrets.GKE_CLUSTER }}
  GKE_ZONE: ${{ secrets.GKE_ZONE }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: 'read'
      id-token: 'write'

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Google Auth
      uses: google-github-actions/auth@v2
      with:
        credentials_json: ${{ secrets.GCP_SA_KEY }}

    - name: Set up Cloud SDK
      uses: google-github-actions/setup-gcloud@v2

    - name: Configure Docker for GAR
      run: |
        gcloud auth configure-docker ${{ env.GAR_LOCATION }}-docker.pkg.dev

    - name: Build and Push API
      run: |
        docker build -t ${{ env.GAR_LOCATION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.GAR_REPOSITORY }}/civil-api:latest -f civil/apps/api/Dockerfile civil
        docker push ${{ env.GAR_LOCATION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.GAR_REPOSITORY }}/civil-api:latest

    - name: Build and Push Web
      run: |
        docker build -t ${{ env.GAR_LOCATION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.GAR_REPOSITORY }}/civil-web:latest \
          --build-arg NEXT_PUBLIC_GTAG_ID=${{ secrets.NEXT_PUBLIC_GTAG_ID }} \
          -f civil/apps/web/Dockerfile civil
        docker push ${{ env.GAR_LOCATION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.GAR_REPOSITORY }}/civil-web:latest

    - name: Build and Push Worker
      run: |
        docker build -t ${{ env.GAR_LOCATION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.GAR_REPOSITORY }}/civil-worker:latest -f civil/apps/worker/Dockerfile civil
        docker push ${{ env.GAR_LOCATION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.GAR_REPOSITORY }}/civil-worker:latest

    - name: Get GKE Credentials
      uses: google-github-actions/get-gke-credentials@v2
      with:
        cluster_name: ${{ env.GKE_CLUSTER }}
        location: ${{ env.GKE_ZONE }}

    - name: Deploy to GKE
      run: |
        # Substitute environment variables in k8s manifests
        export GCP_PROJECT_ID=${{ env.PROJECT_ID }}
        export GAR_REPOSITORY=${{ env.GAR_REPOSITORY }}
        
        # Apply ConfigMap (Secrets should be managed separately or via sealed-secrets, but for now we assume they exist or user applies them)
        kubectl apply -f k8s/env-configmap.yaml
        
        # Apply Deployments and Services
        envsubst < k8s/api-deployment.yaml | kubectl apply -f -
        envsubst < k8s/web-deployment.yaml | kubectl apply -f -
        envsubst < k8s/worker-deployment.yaml | kubectl apply -f -
        
        # Apply Ingress
        kubectl apply -f k8s/ingress.yaml
        
        # Force restart to pick up new images (since we use :latest)
        kubectl rollout restart deployment/civil-api
        kubectl rollout restart deployment/civil-web
        kubectl rollout restart deployment/civil-worker
