apiVersion: v1
kind: ConfigMap
metadata:
  name: civil-config
data:
  # General
  NODE_ENV: "production"
  CIVIL_ENV_LABEL: "production"
  
  # Media / GCS
  MEDIA_S3_ENDPOINT: "https://storage.googleapis.com"
  MEDIA_S3_REGION: "us-east-1"
  MEDIA_BUCKET_PUBLIC: "dev-civil-media"
  MEDIA_BUCKET_ORIGINAL: "dev-civil-raw-uploads"
  MEDIA_PUBLIC_BASE_URL: "https://dev.civilcitizens.ca/media"
  
  # Web
  NEXT_PUBLIC_API_BASE: "/api"
  NEXT_PUBLIC_BASE_URL: "https://dev.civilcitizens.ca"
  NEXT_PUBLIC_MEDIA_BASE_URL: "https://dev.civilcitizens.ca/media"
  NEXT_PUBLIC_GTAG_ID: "G-1ML0TFH7F0"
