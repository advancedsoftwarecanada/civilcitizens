apiVersion: apps/v1
kind: Deployment
metadata:
  name: civil-web
  labels:
    app: civil-web
spec:
  replicas: 2
  selector:
    matchLabels:
      app: civil-web
  template:
    metadata:
      labels:
        app: civil-web
    spec:
      containers:
      - name: civil-web
        image: us-central1-docker.pkg.dev/${GCP_PROJECT_ID}/${GAR_REPOSITORY}/civil-web:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 3001
        envFrom:
        - configMapRef:
            name: civil-config
        - secretRef:
            name: civil-secrets
        livenessProbe:
          httpGet:
            path: /
            port: 3001
          initialDelaySeconds: 30
          periodSeconds: 20
        readinessProbe:
          httpGet:
            path: /
            port: 3001
          initialDelaySeconds: 10
          periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: civil-web
spec:
  selector:
    app: civil-web
  ports:
  - protocol: TCP
    port: 80
    targetPort: 3001
  type: ClusterIP
