  <style>
    .text-tiny{
        font-size: 0.5rem;
        text-align: center;
    }
    /* Ensure modal overlays the bottom nav and tighten vertical padding */
    #mobileFooterMenu{ z-index: 1020 !important; padding-top: 6px !important; padding-bottom: 6px !important; }
            /* Strict palette: make all link states white and remove default link styling */
            #mobileFooterMenu a,
            #mobileFooterMenu a:link,
            #mobileFooterMenu a:visited,
            #mobileFooterMenu a:hover,
            #mobileFooterMenu a:active,
            #mobileFooterMenu a:focus {
                color: #fff !important;
                text-decoration: none !important;
                outline: none !important;
                -webkit-tap-highlight-color: rgba(255,255,255,0.15);
            }
            /* Brand the bottom nav items as red buttons with white icons/text */
            #mobileFooterMenu a .messages-btn,
            #mobileFooterMenu a .notification-btn {
                background: #D52B1E; /* brand red */
                color: #fff !important;
                border-radius: 6px; /* square-ish corners */
                padding: 2px 6px !important; /* tighter to avoid tall rectangles */
                min-width: 56px;
                min-height: 0 !important;
                height: auto !important;
                display: inline-flex;
                flex-direction: column;
                align-items: center;
                justify-content: center;
                gap: 2px; /* minimal space between icon and label */
                box-sizing: border-box;
            }
            /* Reset padding on the inner head container (theme adds big paddings) */
            #mobileFooterMenu .cmn-head { padding: 0 !important; margin: 0 !important; min-height: 0 !important; }
            #mobileFooterMenu .single-item { padding: 0 !important; margin: 0 !important; }
            /* Make icon area compact and square */
            #mobileFooterMenu.header-menu .cmn-head .icon-area,
            #mobileFooterMenu .cmn-head .icon-area {
                width: 30px !important;
                height: 30px !important;
                border-radius: 4px !important; /* slight rounding, not pill */
                display: inline-flex;
                align-items: center;
                justify-content: center;
                background: transparent !important; /* no extra backgrounds */
            }
            /* Control icon size so it fits the 30px box nicely */
            #mobileFooterMenu .cmn-head .icon-area .mat-icon,
            #mobileFooterMenu .cmn-head .icon-area .material-symbols-outlined {
                font-size: 22px !important;
                line-height: 1 !important;
            }
            #mobileFooterMenu .messages-btn .mat-icon,
            #mobileFooterMenu .notification-btn .mat-icon { color: #fff !important; }
            #mobileFooterMenu .text-tiny { color: #fff !important; font-weight: 600; line-height: 1; }
            #mobileFooterMenu a:hover .messages-btn,
            #mobileFooterMenu a:hover .notification-btn { filter: brightness(1.05); }
            #mobileFooterMenu a:active .messages-btn,
            #mobileFooterMenu a:active .notification-btn { filter: brightness(0.95); }
        </style>

        <script>
            (function(){
                try{
                    // Intercept multiple event types to beat router link handlers on mobile
                    var evts = 'click.guestGate touchstart.guestGate touchend.guestGate mousedown.guestGate';
                    $(document).off(evts).on(evts, 'a.guest-gate', function(ev){
                        if (!Meteor.userId()) {
                            // Stop all navigation
                            ev.preventDefault && ev.preventDefault();
                            ev.stopPropagation && ev.stopPropagation();
                            ev.stopImmediatePropagation && ev.stopImmediatePropagation();

                            var target = $(this).data('guest-modal-target') || '#guestCtaModal';
                            // Try Bootstrap modal first
                            try { $(target).modal && $(target).modal('show'); } catch(e){ /* ignore */ }
                            // Fallback show
                            var el = document.querySelector(target);
                            if (el && el.classList.contains('modal')) {
                                el.classList.add('show');
                                el.style.display = 'block';
                                el.removeAttribute('aria-hidden');
                                document.body.classList.add('modal-open');
                            }
                            return false;
                        }
                    });

                                // Capture-phase interception runs before other listeners (e.g., FlowRouter)
                                document.removeEventListener('click', window.__guestGateCapture, true);
                                window.__guestGateCapture = function(e){
                                    try{
                                        if (Meteor.userId()) return; // only guests
                                        var node = e.target;
                                        while (node && node !== document) {
                                            if (node.matches && node.matches('a.guest-gate')) {
                                                e.preventDefault();
                                                e.stopPropagation();
                                                var target = node.getAttribute('data-guest-modal-target') || '#guestCtaModal';
                                                try { $(target).modal && $(target).modal('show'); } catch(err){}
                                                var el = document.querySelector(target);
                                                if (el && el.classList.contains('modal')) {
                                                    el.classList.add('show');
                                                    el.style.display = 'block';
                                                    el.removeAttribute('aria-hidden');
                                                    document.body.classList.add('modal-open');
                                                }
                                                return;
                                            }
                                            node = node.parentNode;
                                        }
                                    }catch(err){ /* ignore */ }
                                };
                                document.addEventListener('click', window.__guestGateCapture, true);
                }catch(e){ console.error(e); }
            })();
        </script>
