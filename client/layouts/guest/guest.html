<template name="guest">
  <div id="guestContainer" class="container-fluid p-0" style="background: linear-gradient(180deg,#FFFFFF 0%,#F8F9FA 50%,#FFFFFF 100%); min-height: 100vh;">

    <!-- Hero -->
    <section class="hero-section text-dark py-5">
      <div class="container">
        <div class="row align-items-center g-4">
          <div class="col-lg-6 text-center">
            <img id="guestLogo" src="/theme/assets/images/logo-lg.png" alt="Civil Citizens" style="max-width:420px;height:auto;">
          </div>
          <div class="col-lg-6 text-center text-lg-start">
            <h1 class="display-5 fw-bold mb-3">Chambers of Citizens</h1>
            <p class="lead mb-4">
              Every Canadian lives in an <strong>Electoral District Association (EDA)</strong>. Civil turns that into value: a place to
              <strong>stay up to date on EDA news</strong>, see what your MP said today in plain English, and work with neighbours and local
              businesses to get things done — one Chamber for real conversations and real impact.
            </p>
            <div class="d-flex flex-column flex-sm-row gap-3 justify-content-center justify-content-lg-start">
              <button class="btn btn-lg btn-primary-cc" data-bs-toggle="modal" data-bs-target="#registerModal">Register</button>
              <button class="btn btn-lg btn-outline-primary-cc" data-bs-toggle="modal" data-bs-target="#loginModal">Login</button>
            </div>
          </div>
        </div>
      </div>
    </section>

    <!-- Everyone in One Room -->
    <section id="stakeholders" class="py-5" style="background: linear-gradient(135deg,#F8F9FA 0%, #E9ECEF 100%);">
      <div class="container">
        <div class="text-center mb-5">
          <h2 class="display-6 fw-bold text-dark">Everyone In One Room</h2>
          <p class="lead text-muted">Six voices, one Chamber — organized by your <strong>Electoral District Association (EDA)</strong>.</p>
        </div>

        <div class="benefit-grid">
          <!-- EDA -->
          <article class="benefit-card card h-100 border-0 shadow-sm">
            <div class="card-body">
              <div class="text-center mb-3"><i class="fas fa-map-marked-alt fa-3x text-primary-cc"></i></div>
              <h3 class="h5 fw-bold text-center">Electoral District Association (EDA)</h3>
              <ul class="list-unstyled">
                <li><i class="fas fa-check text-success me-2"></i>One home for everything happening in your riding</li>
                <li><i class="fas fa-check text-success me-2"></i>Meet neighbours, officials, and local businesses in one place</li>
                <li><i class="fas fa-check text-success me-2"></i>See timely, relevant updates without the national noise</li>
              </ul>
            </div>
          </article>

          <!-- MPs -->
          <article class="benefit-card card h-100 border-0 shadow-sm">
            <div class="card-body">
              <div class="text-center mb-3"><i class="fas fa-user-tie fa-3x text-primary-cc"></i></div>
              <h3 class="h5 fw-bold text-center">Federal & Provincial MPs</h3>
              <ul class="list-unstyled">
                <li><i class="fas fa-check text-success me-2"></i>Reach constituents with clear, plain-language updates</li>
                <li><i class="fas fa-check text-success me-2"></i>Hear structured feedback from real people in your EDA</li>
                <li><i class="fas fa-check text-success me-2"></i>Host townhalls that turn discussion into action</li>
              </ul>
            </div>
          </article>

          <!-- City Councils -->
          <article class="benefit-card card h-100 border-0 shadow-sm">
            <div class="card-body">
              <div class="text-center mb-3"><i class="fas fa-city fa-3x text-primary-cc"></i></div>
              <h3 class="h5 fw-bold text-center">City Councils</h3>
              <ul class="list-unstyled">
                <li><i class="fas fa-check text-success me-2"></i>Get important notices in front of the right residents</li>
                <li><i class="fas fa-check text-success me-2"></i>Coordinate faster across neighbouring municipalities</li>
                <li><i class="fas fa-check text-success me-2"></i>Escalate local concerns to MPs with community backing</li>
              </ul>
            </div>
          </article>

          <!-- Businesses -->
          <article class="benefit-card card h-100 border-0 shadow-sm">
            <div class="card-body">
              <div class="text-center mb-3"><i class="fas fa-store fa-3x text-primary-cc"></i></div>
              <h3 class="h5 fw-bold text-center">Businesses</h3>
              <ul class="list-unstyled">
                <li><i class="fas fa-check text-success me-2"></i>Be discovered by people who actually live and shop here</li>
                <li><i class="fas fa-check text-success me-2"></i>Join civic conversations that affect your costs and customers</li>
                <li><i class="fas fa-check text-success me-2"></i>Find partners and talent nearby—grow local</li>
              </ul>
            </div>
          </article>

          <!-- Citizens -->
          <article class="benefit-card card h-100 border-0 shadow-sm">
            <div class="card-body">
              <div class="text-center mb-3"><i class="fas fa-users fa-3x text-primary-cc"></i></div>
              <h3 class="h5 fw-bold text-center">Citizens</h3>
              <ul class="list-unstyled">
                <li><i class="fas fa-check text-success me-2"></i>Stay current with EDA-based news and MP updates</li>
                <li><i class="fas fa-check text-success me-2"></i>Discuss local problems respectfully; find solutions</li>
                <li><i class="fas fa-check text-success me-2"></i>Join actions: townhalls, petitions, volunteer drives</li>
              </ul>
            </div>
          </article>

          <!-- Civil AI -->
          <article class="benefit-card card h-100 border-0 shadow-sm">
            <div class="card-body">
              <div class="text-center mb-3"><i class="fa-solid fa-microchip fa-3x text-primary-cc"></i></div>
              <h3 class="h5 fw-bold text-center">@Civil AI</h3>
              <ul class="list-unstyled">
                <li><i class="fas fa-check text-success me-2"></i>Turns Hansard into plain-speak with citations</li>
                <li><i class="fas fa-check text-success me-2"></i>Neutral, sourced corrections to keep debate fair</li>
                <li><i class="fas fa-check text-success me-2"></i>Context for bills, MPs, and riding changes—so you don’t have to Google</li>
              </ul>
            </div>
          </article>
        </div>
      </div>
    </section>

    <!-- Local Marketplace -->
    <section id="marketplace" class="py-5 bg-white">
      <div class="container">
        <div class="text-center mb-5">
          <h2 class="display-6 fw-bold text-dark">Local Marketplace</h2>
          <p class="lead text-muted">Shop your Chamber—keep money in the riding. No dropshipping. No big-box ads.</p>
        </div>

        <div class="market-grid">
          <!-- Shop Local Businesses -->
          <article class="benefit-card card h-100 border-0 shadow-sm">
            <div class="card-body">
              <div class="text-center mb-3"><i class="fas fa-store fa-3x text-primary-cc"></i></div>
              <h3 class="h5 fw-bold text-center">Shop Local Businesses</h3>
              <ul class="list-unstyled">
                <li><i class="fas fa-check text-success me-2"></i>Verified businesses inside your EDA</li>
                <li><i class="fas fa-check text-success me-2"></i>Pickup or local delivery only</li>
                <li><i class="fas fa-check text-success me-2"></i>Keep dollars circulating locally</li>
              </ul>
              <div class="text-center mt-4">
                <button class="btn btn-outline-primary-cc btn-lg" data-bs-toggle="modal" data-bs-target="#loginModal">Browse Marketplace</button>
              </div>
            </div>
          </article>

          <!-- Buy & Sell Used Goods -->
          <article class="benefit-card card h-100 border-0 shadow-sm">
            <div class="card-body">
              <div class="text-center mb-3"><i class="fas fa-handshake fa-3x text-primary-cc"></i></div>
              <h3 class="h5 fw-bold text-center">Buy &amp; Sell with Neighbours</h3>
              <ul class="list-unstyled">
                <li><i class="fas fa-check text-success me-2"></i>In-app chat, meet up locally</li>
                <li><i class="fas fa-check text-success me-2"></i>Anti-dropship checks, real photos</li>
                <li><i class="fas fa-check text-success me-2"></i>Safety tips &amp; easy reporting</li>
              </ul>
              <div class="text-center mt-4">
                <button class="btn btn-outline-primary-cc btn-lg" data-bs-toggle="modal" data-bs-target="#loginModal">List an Item</button>
              </div>
            </div>
          </article>
        </div>

        <p class="text-center text-muted small mt-4 mb-0">
          <i class="fas fa-shield-alt me-1"></i>
          Local-only policy: no dropshipping, no big-box store ads, pickup/delivery within your EDA.
        </p>
      </div>
    </section>


  </div>

      <!-- CTA -->
    <section class="cta-section text-dark py-5 mt-4">
      <div class="container text-center">
        <h2 class="display-6 fw-bold mb-3">Start Building Your Chamber of Citizens</h2>
        <p class="lead mb-4">Stay informed. Solve problems together. Keep politics civil.</p>
        <div class="d-flex flex-column flex-sm-row gap-3 justify-content-center">
          <button class="btn btn-lg btn-primary-cc" data-bs-toggle="modal" data-bs-target="#registerModal">Register</button>
          <button class="btn btn-lg btn-outline-primary-cc" data-bs-toggle="modal" data-bs-target="#loginModal">Login</button>
        </div>
      </div>
    </section>

  <style>
    .btn-primary-cc{ background:#D52B1E; border-color:#D52B1E; color:#fff; }
    .btn-primary-cc:hover, .btn-primary-cc:focus{ background:#b0261a; border-color:#b0261a; color:#fff; }
    .btn-outline-primary-cc{ color:#D52B1E; border-color:#D52B1E; background:transparent; }
    .btn-outline-primary-cc:hover, .btn-outline-primary-cc:focus{ background:#D52B1E; border-color:#D52B1E; color:#fff; }
    .text-primary-cc{ color:#D52B1E!important; }

    .hero-section{ background:#FFFFFF; min-height:68vh; display:flex; align-items:center; }
    .benefit-grid{ display:grid; gap:2rem; grid-template-columns:repeat(2,1fr); }
    .market-grid{ display:grid; gap:2rem; grid-template-columns:repeat(2,1fr); }
    .benefit-card{ transition:transform .3s ease, box-shadow .3s ease; background:rgba(255,255,255,.95); backdrop-filter:blur(10px); }
    .benefit-card:hover{ transform:translateY(-5px); box-shadow:0 10px 25px rgba(0,0,0,.15)!important; }

    @media (max-width: 767px){
      .benefit-grid{ grid-template-columns:1fr!important; }
      .market-grid{ grid-template-columns:1fr!important; }
      #guestLogo{ max-width:220px!important; margin-bottom:1rem; padding:20px; }
    }

    /* 3 columns on lg+ for 6 cards */
    @media (min-width: 992px){
      .benefit-grid{ grid-template-columns: repeat(3, 1fr); }
      .market-grid{ grid-template-columns: repeat(2, 1fr); } /* keep marketplace at 2-up on desktop */
    }

    .main-content{ padding:0!important; }

    li { margin-bottom: 20px; border-top: 1px solid #eee; padding-top: 10px; }
  </style>

  <script>
    // Hide app chrome on landing
    $('header,#mobileFooterMenu,#desktopLeftSidebar,#desktopRightSidebar').hide();
  </script>
</template>
