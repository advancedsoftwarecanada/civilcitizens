<template name="profile">

    <div id="templateMain" class="col-12 col-sm-7 mt-0 mt-lg-10 mt-xl-0 d-flex flex-column gap-7 cus-z">
            <!-- Profile Cover Image -->
            <div class="single-box p-0 overflow-hidden">
                <div class="col-md-12">
                    <div class="upload-single cover-img position-relative">
                        <div class="profile-picture text-start">
                            <img class="preview-image w-100 preview-cover" src="{{myUserMeta.coverUrl}}" alt="Cover Image" style="height: 220px; object-fit: cover;">
                        </div>
                        <div class="file-upload p-3 position-absolute" style="right: 10px; bottom: 10px;">
                            <label class="file text-start mt-2">
                                <input type="file" class="fileUploader" data-upload-type="cover" data-upload-preview-class="preview-cover" accept=".jpg, .jpeg, .png, .webp">
                                <span class="cmn-btn d-center gap-1">
                                    <i class="material-symbols-outlined mat-icon fs-2"> edit_note </i>
                                    Change Cover Photo
                                </span>
                            </label>
                        </div>
                    </div>
                </div>
            </div>

            <div class="row">

                <div class="col-12 col-md-4">
                    <div class="single-box p-3">

                        <div class="upload-single">
                            <div class="profile-picture text-start">
                                <img class="preview-image w-100 preview-avatar" src="{{myUserMeta.avatarUrl}}" alt="Preview Image">
                            </div>
                            <div class="file-upload">
                                <label class="file text-center mt-4">
                                    <input type="file" class="fileUploader" data-upload-type="avatar" data-upload-preview-class="preview-avatar" accept=".jpg, .jpeg, .png">
                                    <span class="btn btn-primary d-center gap-1">
                                        Change Profile Photo
                                    </span>
                                </label>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <div class="row">
                <div class="col">
                    <form class="text-center d-grid gap-4">
                        <div class="single-box p-3 p-sm-5">
                            <div class="col-sm-12">
                                <div class="single-input text-start">
                                    <label for="userName">userName</label>
                                    <div class="input-area second">
                                        <input type="text" id="userName" value="{{myUserMeta.userName}}" placeholder="Type userName" maxlength="20">
                                    </div>
                                </div>
                            </div>
                            <div class="row">
                                <div class="col-sm-6">
                                    <div class="single-input text-start">
                                        <label for="firstName">First Name</label>
                                        <div class="input-area second">
                                            <input type="text" id="firstName" value="{{myUserMeta.firstName}}" placeholder="Type first name" >
                                        </div>
                                    </div>
                                </div>
                                <div class="col-sm-6">
                                    <div class="single-input text-start">
                                        <label for="lastName">Last Name</label>
                                        <div class="input-area second">
                                            <input type="text" id="lastName" value="{{myUserMeta.lastName}}" placeholder="Type last name" >
                                        </div>
                                    </div>
                                </div>
                        </div>
                            <div class="col-sm-12 mt-4">
                                <div class="single-input text-start">
                                    <label for="bio">Bio</label>
                                    <div id="bioEditor" class="editor mt-3"></div>
                                    <div id="bioCounter" class="char-counter">0/10000</div>
                                </div>
                            </div>
                            <div class="col-sm-12 mt-4">
                                <div class="btn-area text-end">
                                    <button class="cmn-btn" type="submit">Save Changes</button>
                                </div>
                            </div>
                        </div>
                    </form>
                </div>
            </div>

            <!-- Logout Button -->
            <div class="row">
                <div class="col">
                    <div class="single-box p-3 p-sm-5">
                        <div class="btn-area text-center">
                            <button id="btnLogout" class="btn btn-outline-danger w-100 d-flex align-items-center justify-content-center gap-1">
                                <span class="fw-semibold">⎋ Log Out</span>
                            </button>
                        </div>
                    </div>
                </div>
            </div>

    </div>

            <script>
            $(document).ready(function () {
                const initializeSummernote = setInterval(() => {
                        if (typeof $.fn.summernote !== 'undefined' && $('#bioEditor').length > 0) {
                        clearInterval(initializeSummernote);
                            // Prevent double init if Blaze onRendered already initialized
                            if ($('#bioEditor').next('.note-editor').length) { return; }
                        let isCleaningImages = false;
                        $('#bioEditor').summernote({
                            placeholder: 'Tell us about yourself...',
                            tabsize: 2,
                            height: 200,
                            disableDragAndDrop: true,
                            toolbar: [
                                ['font', ['bold', 'italic', 'underline', 'clear']],
                                ['para', ['ul', 'ol', 'paragraph']],
                                ['table', ['table']],
                                ['insert', ['link']],
                                ['view', ['undo', 'redo']]
                            ],
                            popover: {
                                image: []
                            },
                            tooltip: false,
                            callbacks: {
                                onImageUpload: function(files) {
                                    toastr.warning('Image uploads are disabled for bio.');
                                },
                                onPaste: function(e) {
                                    const ev = e.originalEvent || e;
                                    const items = ev && ev.clipboardData && ev.clipboardData.items ? ev.clipboardData.items : [];
                                    for (let i = 0; i < items.length; i++) {
                                        const it = items[i];
                                        if (it && it.type && it.type.indexOf('image') !== -1) {
                                            e.preventDefault();
                                            toastr.warning('Pasting images is disabled for bio.');
                                            return false;
                                        }
                                    }
                                },
                                onChange: function(contents) {
                                    if (isCleaningImages) return;
                                    if (contents && contents.indexOf('<img') !== -1) {
                                        isCleaningImages = true;
                                        const $dom = $('<div>').html(contents);
                                        if ($dom.find('img').length) {
                                            $dom.find('img').remove();
                                            setTimeout(() => {
                                                $('#bioEditor').summernote('code', $dom.html());
                                                toastr.warning('Images removed from bio content.');
                                                isCleaningImages = false;
                                            }, 0);
                                        } else {
                                            isCleaningImages = false;
                                        }
                                    }
                                }
                            }
                        });
                                        // Set initial content from userManager meta if available
                                        try {
                                            if (window.userManager && typeof window.userManager.getData === 'function') {
                                                const meta = window.userManager.getData().meta || {};
                                                if (meta.bio) {
                                                    $('#bioEditor').summernote('code', meta.bio);
                                                }
                                            }
                                        } catch (e) {
                                            console.warn('Unable to set initial bio content:', e);
                                        }
                        // Char counter
                        const BIO_MAX = 10000;
                        const updateBioCounter = () => {
                            const html = $('#bioEditor').summernote('code') || '';
                            const text = $('<div>').html(html).text();
                            const len = text.length;
                            const $c = $('#bioCounter');
                            $c.text(Math.min(len, BIO_MAX) + '/' + BIO_MAX);
                            $c.toggleClass('over', len > BIO_MAX);
                        };
                        $('#bioEditor').on('summernote.change', updateBioCounter);
                        $('#bioEditor').on('summernote.keyup', updateBioCounter);
                        $('#bioEditor').on('summernote.paste', () => setTimeout(updateBioCounter, 0));
                        updateBioCounter();
                    }
                }, 10);
            });
        </script>
</template>
