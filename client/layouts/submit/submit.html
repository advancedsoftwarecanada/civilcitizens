<template name="submit">
    <div id="templateMain" class="submit-container">

      <!-- Dropdown for Posting Location -->
      <div class="form-group">
        <label for="postChamber" class="dropdown-label">Where to post this?</label>
        <select id="postChamber" class="dropdown-select">
          <option value="self">Self Post (@{{myUserMeta.userName}})</option>
          {{#each myChambers}}
            <option value="{{this.province}}/{{this.chamber}}">Chamber: {{niceName this.province}}/{{niceName this.chamber}}</option>
          {{/each}}
          {{#if province}}
            <option value="{{province}}/{{chamber}}">{{niceName province}}/{{niceName chamber}}</option>
          {{/if}}
        </select>
      </div>

      <button id="addTitleBtn" class="add-title-btn">Add Title</button>

      <!-- Attachment Tray -->
      <div class="attachment-tray">
        <button class="attachment-btn btn" id="addImageBtn" title="Add Image">
          <i class="fa fa-image"></i>
        </button>
        <button class="attachment-btn btn" id="addVideoBtn" title="Add Video">
          <i class="fa fa-video"></i>
        </button>
        <button class="attachment-btn btn" id="addLinkBtn" title="Add Link">
          <i class="fa fa-link"></i>
        </button>
        <button class="attachment-btn btn" id="addPollBtn" title="Add Poll">
          <i class="fa fa-chart-bar"></i>
        </button>
      </div>

      <!-- Attachment Areas -->
      <div id="imageAttachment" class="attachment-area" style="display: none;">
        <label for="postImages" class="upload-label">
          <input type="file" id="postImages" class="fileUploader" accept=".jpg, .jpeg, .png" multiple>
          <div class="upload-box">
            <span class="upload-text">Click or drag and drop to upload images (up to 8)</span>
          </div>
        </label>
        <div id="imagePreview" class="file-list"></div>
      </div>

      <div id="videoAttachment" class="attachment-area" style="display: none;">
        <label for="postVideo" class="upload-label">
          <input type="file" id="postVideo" class="fileUploader" accept=".mp4, .avi, .mov">
          <div class="upload-box">
            <span class="upload-text">Click or drag and drop to upload a video</span>
          </div>
        </label>
      </div>

      <div id="linkAttachment" class="attachment-area" style="display: none;">
        <input type="url" id="postLink" placeholder="Enter URL" class="link-input">
      </div>

      <div id="pollAttachment" class="attachment-area" style="display: none;">
        <div class="poll-options">
          <input type="text" placeholder="Option 1" class="poll-option">
          <input type="text" placeholder="Option 2" class="poll-option">
          <button id="addPollOption" class="add-option-btn">Add Option</button>
        </div>
        <div class="poll-settings">
          <label>Duration: <input type="number" id="pollDuration" value="1" min="1"> days</label>
          <label><input type="checkbox" id="allowMulti"> Allow multiple selections</label>
        </div>
      </div>



      <!-- Summernote Editor -->
      <div id="summernote" class="editor mt-3"></div>
      <script>
        $(document).ready(function () {
          const initializeSummernote = setInterval(() => {
            console.log("SUMMERNOTE CHECKING");
            if (typeof $.fn.summernote !== 'undefined') {
              clearInterval(initializeSummernote);
              $('#summernote').summernote({
                placeholder: 'Write something!',
                tabsize: 2,
                height: 300,
                toolbar: [
                  ['font', ['bold', 'italic', 'underline', 'clear']],
                  ['para', ['ul', 'ol', 'paragraph']],
                  ['table', ['table']],
                  ['insert', ['link']],
                  ['view', ['undo', 'redo']]
                ],
                popover: {
                  image: []
                },
                tooltip: false
              });
              console.log('Summernote initialized successfully!');
            }
          }, 10);

          // Add Title Button
          $('#addTitleBtn').click(function() {
            const input = $('<input type="text" id="postTitle" class="mt-2 post-title-input" placeholder="Title (optional)">');
            $(this).replaceWith(input);
          });

          // Attachment Buttons
          $('.attachment-btn').click(function() {
            const type = $(this).attr('id').replace('add', '').replace('Btn', '').toLowerCase();
            $('.attachment-area').hide();
            $('.attachment-btn').removeClass('active');
            $(this).addClass('active');
            $('#' + type + 'Attachment').show();
          });

          // Poll Add Option
          $('#addPollOption').click(function() {
            const options = $('.poll-option').length;
            if (options < 4) {
              $('.poll-options').append('<input type="text" placeholder="Option ' + (options + 1) + '" class="poll-option">');
            }
          });

          // Image Preview
          $('#postImages').change(function() {
            const files = this.files;
            $('#imagePreview').empty();
            for (let i = 0; i < files.length && i < 8; i++) {
              const file = files[i];
              const reader = new FileReader();
              reader.onload = function(e) {
                //$('#imagePreview').append('<img src="' + e.target.result + '" class="preview-img">');
              };
              reader.readAsDataURL(file);
            }
          });
        });
      </script>



      <!-- Save & Post Buttons -->
      <div class="button-area">
        <button class="cmn-btn post-btn" id="savePost">Post</button>
      </div>

    </div>

    <style>
      /* Main Container */
      .submit-container {
        background-color: #fff;
        color: #333;
        border: 1px solid #ccc;
        border-radius: 8px;
        padding: 20px;
        margin: 0 auto;
        font-family: Arial, sans-serif;
      }

      /* Dropdown Styling */
      .dropdown-label {
        display: block;
        font-size: 14px;
        font-weight: bold;
        margin-bottom: 8px;
      }

      .dropdown-select {
        width: 100%;
        padding: 10px;
        border: 1px solid #ccc;
        border-radius: 4px;
        font-size: 14px;
      }

      /* Post Title Styling */
      .post-title-input {
        width: 100%;
        padding: 10px;
        font-size: 16px;
        border: 1px solid #ccc;
        border-radius: 4px;
        margin-bottom: 20px;
        background:white;
      }

      /* Tabs */
      .post-tabs {
        display: flex;
        border-bottom: 2px solid #eee;
        margin-bottom: 20px;
      }

      .tab-button {
        flex: 1;
        padding: 10px;
        text-align: center;
        border: none;
        background: none;
        font-size: 14px;
        cursor: pointer;
        color: #333;
        border-bottom: 2px solid transparent;
      }

      .tab-button.active {
        border-bottom: 2px solid #007bff;
        color: #007bff;
      }

      .tab-button:hover {
        color: #0056b3;
      }

      /* Summernote Editor */
      .editor {
        border: 1px solid #ccc;
        border-radius: 4px;
        padding: 8px;
        min-height: 200px;
        margin-bottom: 20px;
      }

      /* Upload Area */
      .upload-area {
        border: 2px dashed #ccc;
        border-radius: 8px;
        padding: 20px;
        text-align: center;
        background: #f9f9f9;
        margin-bottom: 20px;
      }

      .upload-area:hover {
        background: #f1f1f1;
      }

      .upload-box {
        font-size: 14px;
        color: #666;
      }

      /* Attachment Tray */
      .attachment-tray {
        display: flex;
        gap: 10px;
        margin: 10px 0;
      }

      .attachment-btn {
        background: none;
        border: 1px solid #ccc;
        border-radius: 4px;
        padding: 8px;
        cursor: pointer;
        font-size: 16px;
        color: #666;
      }

      .attachment-btn:hover {
        background: #f0f0f0;
      }

      .attachment-btn.active {
        background: #007bff;
        color: white;
      }

      /* Attachment Areas */
      .attachment-area {
        margin: 10px 0;
        padding: 10px;
        border: 1px solid #ccc;
        border-radius: 4px;
        background: #f9f9f9;
      }

      .link-input, .quote-input {
        width: 100%;
        padding: 8px;
        border: 1px solid #ccc;
        border-radius: 4px;
      }

      .poll-options {
        display: flex;
        flex-direction: column;
        gap: 5px;
      }

      .poll-option {
        padding: 8px;
        border: 1px solid #ccc;
        border-radius: 4px;
      }

      .add-option-btn {
        margin-top: 5px;
        padding: 5px 10px;
        background: #007bff;
        color: white;
        border: none;
        border-radius: 4px;
        cursor: pointer;
      }

      .poll-settings {
        margin-top: 10px;
        display: flex;
        flex-direction: column;
        gap: 5px;
      }

      .file-list {
        display: flex;
        flex-direction: column;
        gap: 10px;
        margin-top: 10px;
      }

      .file-item {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 8px;
        border: 1px solid #ccc;
        border-radius: 4px;
        background: #f9f9f9;
      }

      .file-preview {
        width: 50px;
        height: 50px;
        object-fit: cover;
        border-radius: 4px;
      }

      .file-info {
        flex: 1;
      }

      .file-name {
        font-weight: bold;
      }

      .file-status {
        font-size: 12px;
        color: #666;
      }

      .upload-progress {
        width: 100px;
        height: 4px;
        background: #eee;
        border-radius: 2px;
        overflow: hidden;
      }

      .upload-progress-bar {
        height: 100%;
        background: #007bff;
        width: 0%;
        transition: width 0.3s;
      }

      .add-title-btn {
        background: none;
        border: 1px solid #ccc;
        padding: 5px 10px;
        border-radius: 4px;
        cursor: pointer;
        color: #666;
      }

      .add-title-btn:hover {
        background: #f0f0f0;
      }
    </style>

  </template>
