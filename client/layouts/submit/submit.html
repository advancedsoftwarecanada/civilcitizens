<template name="submit">
    <div id="templateMain" class="submit-container">

      <!-- Dropdown for Posting Location -->
      <div class="form-group">
        <label for="postChamber" class="dropdown-label">Where to post this?</label>
        <select id="postChamber" class="dropdown-select">
          <option value="self">Self Post (@{{myUserMeta.userName}})</option>
          {{#each myChambers}}
            <option value="{{this.province}}/{{this.chamber}}">Chamber: {{niceName this.province}}/{{niceName this.chamber}}</option>
          {{/each}}
          {{#if province}}
            <option value="{{province}}/{{chamber}}">{{niceName province}}/{{niceName chamber}}</option>
          {{/if}}
        </select>
      </div>

      <!-- Post Options (Jurisdiction + NSFW) -->
      <div class="post-options mt-2">
        <label for="postJurisdiction" class="dropdown-label">Post type</label>
        <select id="postJurisdiction" class="dropdown-select">
          <option value="citizen">Citizen</option>
          <option value="municipal">Municipal</option>
          <option value="provincial">Provincial</option>
          <option value="federal">Federal</option>
        </select>
        <div class="form-check mt-2">
          <label class="form-check-label" for="postNsfw">
            <input type="checkbox" id="postNsfw" class="form-check-input" /> NSFW
          </label>
        </div>
      </div>

      <button id="addTitleBtn" class="add-title-btn">Add Title</button>
      <div id="titleCounter" class="char-counter" style="display:none;">0/300</div>

      <!-- Attachment Tray -->
      <div class="attachment-tray">
        <button class="attachment-btn btn" id="addImageBtn" title="Add Image">
          <i class="fa fa-image"></i>
        </button>
        <button class="attachment-btn btn" id="addVideoBtn" title="Add Video">
          <i class="fa fa-video"></i>
        </button>
        <button class="attachment-btn btn" id="addLinkBtn" title="Add Link">
          <i class="fa fa-link"></i>
        </button>
        <button class="attachment-btn btn" id="addPollBtn" title="Add Poll">
          <i class="fa fa-chart-bar"></i>
        </button>
      </div>

      <!-- Attachment Areas -->
      <div id="imageAttachment" class="attachment-area" style="display: none;">
        <label for="postImages" class="upload-label">
          <input type="file" id="postImages" class="fileUploader" accept=".jpg, .jpeg, .png" multiple>
          <div class="upload-box">
            <span class="upload-text">Click or drag and drop to upload images (up to 8)</span>
          </div>
        </label>
        <div id="imagePreview" class="file-list"></div>
      </div>

      <div id="videoAttachment" class="attachment-area" style="display: none;">
        <label for="postVideo" class="upload-label">
          <input type="file" id="postVideo" class="fileUploader" accept=".mp4, .avi, .mov">
          <div class="upload-box">
            <span class="upload-text">Click or drag and drop to upload a video</span>
          </div>
        </label>
      </div>

      <div id="linkAttachment" class="attachment-area" style="display: none;">
        <input type="url" id="postLink" placeholder="Enter URL to preview" class="link-input">
        <div id="linkPreview" class="link-preview" style="display: none;">
          <div class="preview-loading">
            <div class="loading-spinner"></div>
            <span>Fetching preview...</span>
          </div>
          <div class="preview-content">
            <div class="preview-image">
              <img id="previewImg" src="" alt="Preview">
            </div>
            <div class="preview-details">
              <h4 id="previewTitle">Title</h4>
              <p id="previewDescription">Description</p>
              <small id="previewUrl">URL</small>
            </div>
          </div>
          <div class="preview-error" style="display: none;">
            <i class="fa fa-exclamation-triangle"></i>
            <span>Unable to fetch preview</span>
          </div>
        </div>
      </div>

      <div id="pollAttachment" class="attachment-area" style="display: none;">
        <div class="poll-options">
          <input type="text" placeholder="Option 1" class="poll-option">
          <input type="text" placeholder="Option 2" class="poll-option">
          <button id="addPollOption" class="add-option-btn">Add Option</button>
        </div>
        <div class="poll-settings">
          <label>Duration: <input type="number" id="pollDuration" value="1" min="1"> days</label>
          <label><input type="checkbox" id="allowMulti"> Allow multiple selections</label>
        </div>
      </div>



      <!-- Summernote Editor -->
      <div id="summernote" class="editor mt-3"></div>
      <div id="bodyCounter" class="char-counter">0/40000</div>
      
      <script>
        $(document).ready(function () {
          const initializeSummernote = setInterval(() => {
            console.log("SUMMERNOTE CHECKING");
            if (typeof $.fn.summernote !== 'undefined') {
              clearInterval(initializeSummernote);
              $('#summernote').summernote({
                placeholder: 'Write something!',
                tabsize: 2,
                height: 300,
                toolbar: [
                  ['font', ['bold', 'italic', 'underline', 'clear']],
                  ['para', ['ul', 'ol', 'paragraph']],
                  ['table', ['table']],
                  ['insert', ['link']],
                  ['view', ['undo', 'redo']]
                ],
                popover: {
                  image: []
                },
                tooltip: false
              });
              console.log('Summernote initialized successfully!');

              // Body char counter (plaintext length up to 40,000)
              const BODY_MAX = 40000;
              const updateBodyCounter = () => {
                const html = $('#summernote').summernote('code') || '';
                const text = $('<div>').html(html).text();
                const len = text.length;
                const $c = $('#bodyCounter');
                $c.text(Math.min(len, BODY_MAX) + '/' + BODY_MAX);
                $c.toggleClass('over', len > BODY_MAX);
              };
              $('#summernote').on('summernote.change', updateBodyCounter);
              $('#summernote').on('summernote.keyup', updateBodyCounter);
              $('#summernote').on('summernote.paste', () => setTimeout(updateBodyCounter, 0));
              updateBodyCounter();
            }
          }, 10);

          // Add Title Button
          $('#addTitleBtn').click(function() {
            if ($('#postTitle').length) return;
            const input = $('<input type="text" id="postTitle" class="mt-2 post-title-input" placeholder="Title (optional)" maxlength="300">');
            $(this).hide();
            $('#titleCounter').show();
            $(this).after(input);
          });

          // Title char counter
          $(document).on('input', '#postTitle', function() {
            const max = 300;
            const val = $(this).val() || '';
            const $c = $('#titleCounter');
            $c.text(val.length + '/' + max);
            $c.toggleClass('over', val.length > max);
          });

          // Attachment Buttons
          $('.attachment-btn').click(function() {
            const type = $(this).attr('id').replace('add', '').replace('Btn', '').toLowerCase();
            $('.attachment-area').hide();
            $('.attachment-btn').removeClass('active');
            $(this).addClass('active');
            $('#' + type + 'Attachment').show();
          });

          // Poll Add Option
          $('#addPollOption').click(function() {
            const options = $('.poll-option').length;
            if (options < 4) {
              $('.poll-options').append('<input type="text" placeholder="Option ' + (options + 1) + '" class="poll-option">');
            }
          });

          // Link Preview Functionality
          window.linkPreviewData = null;
          let previewTimeout = null;

          $('#postLink').on('input', function() {
            const url = $(this).val().trim();
            clearTimeout(previewTimeout);

            if (url) {
              previewTimeout = setTimeout(() => {
                fetchLinkPreview(url);
              }, 1000); // Wait 1 second after user stops typing
            } else {
              hideLinkPreview();
            }
          });

          function fetchLinkPreview(url) {
            // Show loading state
            $('#linkPreview .preview-loading').show();
            $('#linkPreview .preview-content').hide();
            $('#linkPreview .preview-error').hide();
            $('#linkPreview').show();

            // Use our API endpoint to fetch link metadata
            fetch('/api/links/preview', {
              method: 'POST',
              headers: {
                'Content-Type': 'application/json',
              },
              body: JSON.stringify({ url: url })
            })
            .then(response => response.json())
            .then(data => {
              if (data.status === 'success') {
                showLinkPreview(data.metadata);
                window.linkPreviewData = data.metadata;
              } else {
                showLinkPreviewError();
                window.linkPreviewData = null;
              }
            })
            .catch(error => {
              console.error('Error fetching link preview:', error);
              showLinkPreviewError();
              window.linkPreviewData = null;
            });
          }

          function showLinkPreview(metadata) {
            $('#linkPreview .preview-loading').hide();
            $('#linkPreview .preview-error').hide();

            // Set preview data
            $('#previewTitle').text(metadata.title || 'No title available');
            $('#previewDescription').text(metadata.description || 'No description available');
            $('#previewUrl').text(metadata.url || $('#postLink').val());

            // Handle image
            if (metadata.image) {
              $('#previewImg').attr('src', metadata.image).show();
              $('.preview-image').show();
            } else {
              $('.preview-image').hide();
            }

            $('#linkPreview .preview-content').show();
          }

          function showLinkPreviewError() {
            $('#linkPreview .preview-loading').hide();
            $('#linkPreview .preview-content').hide();
            $('#linkPreview .preview-error').show();
          }

          function hideLinkPreview() {
            $('#linkPreview').hide();
            window.linkPreviewData = null;
          }

          // Image Preview - REMOVED to avoid conflicts with submit.js handler
          // $('#postImages').change(function() {
          //   const files = this.files;
          //   $('#imagePreview').empty();
          //   for (let i = 0; i < files.length && i < 8; i++) {
          //     const file = files[i];
          //     const reader = new FileReader();
          //     reader.onload = function(e) {
          //       //$('#imagePreview').append('<img src="' + e.target.result + '" class="preview-img">');
          //     };
          //     reader.readAsDataURL(file);
          //   }
          // });
        });
      </script>



      <!-- Save & Post Buttons -->
      <div class="button-area">
        <button class="cmn-btn post-btn" id="savePost">Post</button>
      </div>

    </div>

    <style>
      /* Main Container */
      .submit-container {
        background-color: #fff;
        color: #333;
        border: 1px solid #ccc;
        border-radius: 8px;
        padding: 20px;
        margin: 0 auto;
        font-family: Arial, sans-serif;
      }

      /* Dropdown Styling */
      .dropdown-label {
        display: block;
        font-size: 14px;
        font-weight: bold;
        margin-bottom: 8px;
      }

      .dropdown-select {
        width: 100%;
        padding: 10px;
        border: 1px solid #ccc;
        border-radius: 4px;
        font-size: 14px;
      }

      /* Post Title Styling */
      .post-title-input {
        width: 100%;
        padding: 10px;
        font-size: 16px;
        border: 1px solid #ccc;
        border-radius: 4px;
        margin-bottom: 4px;
        background:white;
      }

      .char-counter { font-size: 12px; color: #888; text-align: right; margin-bottom: 14px; }
      .char-counter.over { color: #c0392b; font-weight: 600; }

      /* Tabs */
      .post-tabs {
        display: flex;
        border-bottom: 2px solid #eee;
        margin-bottom: 20px;
      }

      .tab-button {
        flex: 1;
        padding: 10px;
        text-align: center;
        border: none;
        background: none;
        font-size: 14px;
        cursor: pointer;
        color: #333;
        border-bottom: 2px solid transparent;
      }

      .tab-button.active {
        border-bottom: 2px solid #007bff;
        color: #007bff;
      }

      .tab-button:hover {
        color: #0056b3;
      }

      /* Summernote Editor */
      .editor {
        border: 1px solid #ccc;
        border-radius: 4px;
        padding: 8px;
        min-height: 200px;
        margin-bottom: 8px;
      }

      /* Upload Area */
      .upload-area {
        border: 2px dashed #ccc;
        border-radius: 8px;
        padding: 20px;
        text-align: center;
        background: #f9f9f9;
        margin-bottom: 20px;
      }

      .upload-area:hover {
        background: #f1f1f1;
      }

      .upload-box {
        font-size: 14px;
        color: #666;
      }
      </style>
</template>
