<template name="timeline">

    <div id="templateMain" class="col-12 col-sm-7 mt-0 mt-lg-10 mt-xl-0 d-flex flex-column gap-7 cus-z">
      {{#each posts}}
        <div class="post-item d-flex flex-column gap-5 gap-md-7" id="news-feed" data-post-id="{{_id}}">
          <div class="post-single-box p-3 p-sm-5">
            <div class="top-area pb-5">
              <div class="profile-area d-center justify-content-between">
                <div class="avatar-item d-flex gap-3 align-items-center">
                  <div class="avatar position-relative">
                    {{#if isAd this}}
                      <img class="avatar-img avatar-size" src="{{this.author.avatar_url}}" alt="avatar">
                    {{else}}
                      <img class="avatar-img avatar-size" src="{{this.author.avatar_url}}" alt="avatar">
                    {{/if}}
                  </div>
                  <div class="info-area">
                    <h6 class="m-0" style="text-transform: lowercase;">
                      @{{this.author.username}}
                    </h6>
                    <span class="mdtxt status">Bay of Quinte</span>
                    {{#if isAd this}}
                      <span class="mdtxt status">Sponsored Advertisement</span>
                    {{else}}

                    {{/if}}
                  </div>
                </div>

                {{#if isAd this}}

                {{else}}

                  <!-- OPTIONS -->
                {{/if}}

              </div>
              <a class="hover-pointer" href="/post/{{seo_url}}">
                <div class="py-4 post-content">
                  <h2 class="mdtxt">{{title}}</h2>
                  <p class="description">{{{body}}}</p>
                </div>
              </a>
              {{#if image}}
                <div class="post-img">
                  {{#if isAd this}}
                    <a href="{{url}}" onclick="window.open('{{url}}'); return false;">
                      <img src="{{image}}" class="w-100" alt="image">
                    </a>
                  {{else}}
                    <img src="{{image}}" class="w-100" alt="image">
                  {{/if}}
                </div>
              {{/if}}
              {{#if isAd this}}
                <p style="font-size: 0.8em; text-align: center;">30% Of this ad was donated to charity</p>
              {{else}}
                <button class="read-more-btn" style="display: none;">Read More</button>
              {{/if}}
            </div>

            {{#if isAd this}}

            {{else}}

            <div class="like-comment-share py-5 flex-wrap">
              <!-- Upvote/Downvote Section -->
              <div class="vote-section d-flex align-items-center gap-2">
                <button class="upvote-btn">
                  <i class="material-symbols-outlined mat-icon">thumb_up</i>
                </button>
                <span class="score">{{voteCount}}</span>
                <button class="downvote-btn">
                  <i class="material-symbols-outlined mat-icon">thumb_down</i>
                </button>
              </div>

              <!-- Action Buttons -->
              <div class="action-buttons d-flex align-items-center gap-3">
                <a href="/post/{{seo_url}}">
                  <button class="comment-btn">
                  <i class="material-symbols-outlined mat-icon">chat</i>
                  0
                </button>
              </a>
                <button class="bookmark-btn">
                  <i class="material-symbols-outlined mat-icon">bookmark</i>
                  0
                </button>
                <button class="share-btn">
                  <i class="material-symbols-outlined mat-icon">share</i>
                  0
                </button>
              </div>
            </div>

            {{/if}}

          </div>
        </div>
      {{/each}}
    </div>
  </template>
