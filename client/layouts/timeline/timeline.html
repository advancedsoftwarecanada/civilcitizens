<template name="timeline">

  <div id="templateMain" class="timeline-page">


      {{#if isViewingChamber}}
        {{#with thisChamber}}
          <div class="row">
            <div class="col-lg-12">
                <div class="banner-area pages-create mb-5">
                    <div class="single-box p-5">
                        <div class="top-area py-4 d-center flex-wrap gap-3 justify-content-between align-items-start">
                            <div class="d-flex gap-3 align-items-center">
                                <div class="text-area text-start">
                                    <h6>Citizens Chamber Of</h6>
                                    <h4 class="m-0">{{niceName chamber}}</h4>
                                    <h5 class="m-0"><span style="text-transform: uppercase;">{{province}}</span>, Canada</h5>
                                    <div class="mt-4 friends-list d-flex flex-wrap gap-2 align-items-center text-center">
                                        <span class="mdtxt d-center following">{{stats.members}} Home Members</span>
                                        <span class="mdtxt d-center following">{{stats.followers}} Followers</span>
                                        <span class="mdtxt d-center following">{{stats.posts}} Posts</span>
                                        <span class="mdtxt d-center following">{{stats.organizations}} Organizations</span>
                                        <span class="mdtxt d-center following">{{stats.events}} Events</span>
                                    </div>
                                </div>
                            </div>
                            <div class="right-col d-flex flex-column align-items-end gap-3">
                              {{#if isHomeChamber}}
                                <div class="cmn-btn d-center gap-1">
                                  ⭐ Home Chamber
                                </div>
                              {{else}}
                                {{#if isFollowing}}
                                  <div class="cmn-btn d-center gap-1 unfollow-btn">
                                    <i class="material-symbols-outlined mat-icon fs-4"> person_add_disabled </i>
                                    Unfollow
                                  </div>
                                {{else}}
                                  <div class="cmn-btn d-center gap-1 follow-btn">
                                    <i class="material-symbols-outlined mat-icon fs-4"> person_add </i>
                                    Follow
                                  </div>
                                {{/if}}
                              {{/if}}
                              
                            </div>
                        </div>
                        <div class="page-details">
                            <div class="tab-toolbar d-flex align-items-center justify-content-between flex-wrap gap-2 mt-5 pt-4">
                <ul class="nav flex-wrap gap-2 tab-area m-0">
                  <li class="nav-item" role="presentation">
                    <a href="#" class="nav-link d-center tab-sort {{activeTab 'sort' 'latest'}}" data-sort="latest">Latest</a>
                  </li>
                  <li class="nav-item" role="presentation">
                    <a href="#" class="nav-link d-center tab-sort {{activeTab 'sort' 'hot'}}" data-sort="hot">Hot</a>
                  </li>
                  <li class="nav-item d-none d-md-block" aria-hidden="true"><span class="text-muted mx-2">|</span></li>
                  <li class="nav-item" role="presentation">
                    <a href="#" class="nav-link d-center tab-gov {{activeTab 'gov' 'all'}}" data-gov="all">All</a>
                  </li>
                  <li class="nav-item" role="presentation">
                    <a href="#" class="nav-link d-center tab-gov {{activeTab 'gov' 'federal'}}" data-gov="federal">Federal</a>
                  </li>
                  <li class="nav-item" role="presentation">
                    <a href="#" class="nav-link d-center tab-gov {{activeTab 'gov' 'provincial'}}" data-gov="provincial">Provincial</a>
                  </li>
                  <li class="nav-item" role="presentation">
                    <a href="#" class="nav-link d-center tab-gov {{activeTab 'gov' 'municipal'}}" data-gov="municipal">Municipal</a>
                  </li>
                  <li class="nav-item" role="presentation">
                    <a href="#" class="nav-link d-center tab-gov {{activeTab 'gov' 'citizen'}}" data-gov="citizen">Citizen</a>
                  </li>
                </ul>
                              <!-- no MP chip in toolbar; use theme-styled panel below -->
                            </div>
                            {{#if isGov 'federal'}}
                              {{#if currentMember}}
                                <!-- Mobile compact card -->
                                <div class="mp-card d-lg-none d-flex align-items-center gap-3 mt-3 p-3 p-sm-3">
                                  <img class="mp-photo" src="{{mpPhoto this}}" alt="Member photo">
                                  <div class="flex-grow-1">
                                    <div class="small text-muted">Member of Parliament</div>
                                    <div class="d-flex align-items-center gap-2">
                                      <div class="h6 m-0">{{currentMember.firstName}} {{currentMember.lastName}}</div>
                                      {{#if currentMember.caucus}}
                                        <span class="party-badge {{partyClass currentMember.caucus}}">{{currentMember.caucus}}</span>
                                      {{/if}}
                                    </div>
                  <div class="links small mt-1 d-flex gap-2">
                                      {{#if currentMember.profileUrl}}
                    <a href="{{currentMember.profileUrl}}" target="_blank" rel="noopener" class="mini-btn">OurCommons</a>
                                      {{/if}}
                                      {{#if currentMember.websites}}
                    <a href="{{mpWebsite this}}" target="_blank" rel="noopener" class="mini-btn">Website</a>
                                      {{/if}}
                                      {{#if currentMember.emails}}
                    <a href="mailto:{{mpEmail this}}" class="mini-btn">Email</a>
                                      {{/if}}
                                    </div>
                                  </div>
                                </div>

                                <!-- Desktop theme-styled panel -->
                                <div class="single-box p-3 p-sm-4 d-none d-lg-block" style="margin-top:12px;">
                                  <div class="head-area text-start">
                                    <h6>Member of Parliament</h6>
                                  </div>
                                  <ul class="d-grid gap-3 mt-3">
                                    <li class="d-center gap-3 justify-content-between">
                                      <div class="info-area d-flex align-items-center gap-3">
                                        <img src="{{mpPhoto this}}" alt="MP photo" style="width:44px;height:44px;border-radius:10px;object-fit:cover;border:1px solid #e9ecef;">
                                        <div class="d-flex align-items-center gap-2 flex-wrap">
                                          <span class="mdtxt fw-semibold">{{currentMember.firstName}} {{currentMember.lastName}}</span>
                                          {{#if currentMember.caucus}}
                                            <span class="party-badge {{partyClass currentMember.caucus}}">{{currentMember.caucus}}</span>
                                          {{/if}}
                                        </div>
                                      </div>
                                      <div class="input-item d-center text-start">
                                        <div class="d-flex align-items-center gap-2 small">
                                          {{#if currentMember.profileUrl}}
                                            <a href="{{currentMember.profileUrl}}" target="_blank" rel="noopener" class="mini-btn">OurCommons</a>
                                          {{/if}}
                                          {{#if currentMember.websites}}
                                            <a href="{{mpWebsite this}}" target="_blank" rel="noopener" class="mini-btn">Website</a>
                                          {{/if}}
                                          {{#if currentMember.emails}}
                                            <a href="mailto:{{mpEmail this}}" class="mini-btn">Email</a>
                                          {{/if}}
                                        </div>
                                      </div>
                                    </li>
                                  </ul>
                                </div>
                              {{/if}}
                            {{/if}}
                            {{#if isGov 'provincial'}}
                              <div class="mp-card d-flex align-items-center gap-3 mt-4 p-3 p-sm-3" style="background:#fff;border:1px dashed #e3e6ea;border-radius:12px">
                                <div class="flex-grow-1">
                                  <div class="small text-muted">Provincial representative</div>
                                  <div class="mdtxt">Coming soon — we’ll show your MPP/MLA info here.</div>
                                </div>
                              </div>
                            {{/if}}
                            {{#if isGov 'municipal'}}
                              <div class="mp-card d-flex align-items-center gap-3 mt-4 p-3 p-sm-3" style="background:#fff;border:1px dashed #e3e6ea;border-radius:12px">
                                <div class="flex-grow-1">
                                  <div class="small text-muted">Municipal representatives</div>
                                  <div class="mdtxt">Coming soon — we’ll list your mayor and council here.</div>
                                </div>
                              </div>
                            {{/if}}
                            {{#if isGov 'citizen'}}
                              <div class="mp-card d-flex align-items-center gap-3 mt-4 p-3 p-sm-3" style="background:#fff;border:1px dashed #e3e6ea;border-radius:12px">
                                <div class="flex-grow-1">
                                  <div class="small text-muted">Citizen posts</div>
                                  <div class="mdtxt">Coming soon — citizen posts scoped to your chamber.</div>
                                </div>
                              </div>
                            {{/if}}
                        </div>
                    </div>
                </div>
            </div>
        </div>
      {{/with}}
    {{/if}}




  {{#each posts}}
        <div class="post-item d-flex flex-column gap-5 gap-md-7" id="news-feed" data-post-id="{{_id}}">
          <div class="post-single-box p-3 p-sm-5">
            <div class="top-area pb-5">
              <div class="profile-area d-center justify-content-between  mb-2">
                <div class="avatar-item d-flex gap-3 align-items-center">
                  <div class="avatar position-relative">
                    {{#if isAd this}}
                      <img class="avatar-img avatar-size" src="{{this.author.avatarUrl}}" alt="avatar">
                    {{else}}
                      <a href="/u/{{this.author.userName}}">
                        <img class="avatar-img avatar-size" src="{{this.author.avatarUrl}}" alt="avatar">
                      </a>
                    {{/if}}
                  </div>
                  <div class="info-area">
                      <h6 class="m-0">
                        <a href="/u/{{this.author.userName}}">
                          @{{this.author.userName}}
                        </a>
                      </h6>
                    {{#if isAd this}}
                      <span class="mdtxt status">Sponsored Advertisement</span>
                    {{else}}
                      {{#if postType 'self'}}
                        <span class="mdtxt status">{{jurisdictionLabel this}}</span>
                      {{else if postType 'chamber'}}
                        <span class="mdtxt status"><a href="/c/{{this.province}}/{{this.chamber}}" style="color: inherit; text-decoration: none;"><strong class="province-uppercase">{{this.province}}</strong> / <strong>{{niceName this.chamber}}</strong></a> • {{jurisdictionLabel this}}</span>
                      {{else}}
                        <span class="mdtxt status">{{jurisdictionLabel this}}</span>
                      {{/if}}
                      <span class="mdtxt time-ago">• {{timeAgo this.createdAt}}</span>
                    {{/if}}
                  </div>
                </div>

                {{#if isAd this}}

                {{else}}

                  <!-- OPTIONS -->
                {{/if}}

              </div>
              <a class="hover-pointer" href="/post/{{seoUrl}}">
                <div class="mt-2">
                  <div class="">
                    <h2 class="mdtxt">{{title}}</h2>
                    <div class="description truncate-in-timeline">{{{body}}}</div>
                  </div>
                </div>
              </a>
              {{#if images}}
                <div class="post-images">
                  {{#each images}}
                    <div class="post-img" data-post-url="/post/{{../seoUrl}}">
                      {{#if ../isAd}}
                        <a href="{{../url}}" onclick="window.open('{{../url}}'); return false;">
                          <img src="{{url}}" class="w-100" alt="image"
                               onerror="this.style.display='none'; this.nextElementSibling.style.display='block';">
                          <div class="image-error" style="display:none; padding: 16px; text-align:center; background:#f8f9fa; border-radius: 12px; color:#666;">
                            <i class="material-symbols-outlined" style="font-size: 32px; opacity: 0.5;">image_not_supported</i>
                            <small>{{url}}</small>
                          </div>
                        </a>
                      {{else}}
                        <img src="{{url}}" class="w-100" alt="image"
                             onerror="this.style.display='none'; this.nextElementSibling.style.display='block';">
                        <div class="image-error" style="display:none; padding: 16px; text-align:center; background:#f8f9fa; border-radius: 12px; color:#666;">
                          <i class="material-symbols-outlined" style="font-size: 32px; opacity: 0.5;">image_not_supported</i>
                          <small>{{url}}</small>
                        </div>
                      {{/if}}
                    </div>
                  {{/each}}
                </div>
              {{else if linkAttachment}}
                <div class="post-link-preview">
                  <a href="{{linkAttachment.url}}" target="_blank" class="link-preview-card {{#unless linkAttachment.preview.image}}no-image{{/unless}}">
                    {{#if linkAttachment.preview.image}}
                      <div class="link-preview-image">
                        <img src="{{linkAttachment.preview.image}}" alt="Link preview" onerror="this.style.display='none'">
                      </div>
                    {{/if}}
                    <div class="link-preview-content">
                      <h4 class="link-preview-title">{{linkAttachment.preview.title}}</h4>
                      <p class="link-preview-description">{{linkAttachment.preview.description}}</p>
                      <small class="link-preview-url">{{linkAttachment.url}}</small>
                    </div>
                  </a>
                </div>
              {{/if}}
              {{#if isAd this}}
                <p style="font-size: 0.8em; text-align: center;">30% Of this ad was donated to charity</p>
              {{else}}
                <button class="read-more-btn" style="display: none;">Read More</button>
              {{/if}}
            </div>

            {{#if isAd this}}

            {{else}}

            <div class="like-comment-share py-5 flex-wrap">
              <!-- Upvote/Downvote Section -->
              <div class="vote-section d-flex align-items-center gap-2">
                <button class="upvote-btn">
                  <i class="material-symbols-outlined mat-icon">thumb_up</i>
                </button>
                <span class="score">{{voteCount}}</span>
                <button class="downvote-btn">
                  <i class="material-symbols-outlined mat-icon">thumb_down</i>
                </button>
              </div>

              <!-- Action Buttons -->
              <div class="action-buttons d-flex align-items-center gap-3">
                <a href="/post/{{seoUrl}}">
                  <button class="comment-btn">
                  <i class="material-symbols-outlined mat-icon">chat</i>
                  {{commentCount}}
                </button>
              </a>
                <!-- <button class="bookmark-btn">
                  <i class="material-symbols-outlined mat-icon">bookmark</i>
                  0
                </button>
                <button class="share-btn">
                  <i class="material-symbols-outlined mat-icon">share</i>
                  0
                </button> -->
              </div>
            </div>

            {{/if}}

          </div>
        </div>
      {{/each}}

      <!-- Loading indicator -->
      {{#if isLoading}}
        <div class="loading-indicator text-center py-4">
          <div class="spinner-border text-primary" role="status">
            <span class="visually-hidden">Loading...</span>
          </div>
          <p class="mt-2 text-muted">Loading more posts...</p>
        </div>
      {{/if}}

      <!-- No more posts indicator -->
      {{#unless hasMore}}
        {{#if posts}}
          <div class="no-more-posts text-center py-4">
            <p class="text-muted">You've reached the end! 🎉</p>
          </div>
        {{/if}}
      {{/unless}}
    </div>
  </template>
