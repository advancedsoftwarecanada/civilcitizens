services:
  nginx:
    image: nginx:1.25-alpine
    profiles: [app]
    volumes:
      - ./ops/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ../private/ssl_certs/origin_cert.pem:/etc/nginx/ssl/origin_cert.pem:ro
      - ../private/ssl_certs/private_key:/etc/nginx/ssl/private_key:ro
    ports:
      - "80:80"
      - "443:443"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost/nginx-health"]
      interval: 10s
      timeout: 5s
      retries: 5
    depends_on: [api]

  api:
    profiles: [app]
    build:
      context: .
      dockerfile: ./apps/api/Dockerfile
    env_file: ./apps/api/.env
    ports:
      - "3000:3000"
    depends_on: [postgres, redis]
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://localhost:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\" "]
      interval: 10s
      timeout: 5s
      retries: 5

  worker:
    profiles: [app]
    build:
      context: .
      dockerfile: ./apps/worker/Dockerfile
    env_file: ./apps/api/.env
    depends_on: [redis, postgres]

  web:
    profiles: [app]
    build:
      context: .
      dockerfile: ./apps/web/Dockerfile
    env_file: ./apps/web/.env
    environment:
      # Use relative path so it works behind Nginx and Cloudflare
      NEXT_PUBLIC_API_BASE: /api
      # Optional base URL for absolute links (can be overridden in env)
      NEXT_PUBLIC_BASE_URL: http://localhost
    depends_on: [api]
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://localhost:3001').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\" "]
      interval: 10s
      timeout: 5s
      retries: 5

  postgres:
    profiles: [infra]
    image: postgres:16-alpine
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: civil
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    profiles: [infra]
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes", "--appendfsync", "everysec"]
    volumes:
      - redisdata:/data

volumes:
  pgdata:
  redisdata:
