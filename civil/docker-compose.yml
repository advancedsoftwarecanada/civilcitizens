services:
  nginx:
    image: nginx:1.25-alpine
    profiles: [app]
    restart: unless-stopped
    volumes:
      - ./ops/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "${NGINX_HTTP_PORT:-80}:80"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost/nginx-health"]
      interval: 10s
      timeout: 5s
      retries: 5
    depends_on:
      api:
        condition: service_healthy
      web:
        condition: service_healthy

  api:
    profiles: [app]
    build:
      context: .
      dockerfile: ./apps/api/Dockerfile
    environment:
      # Required: Prisma database URL (uses local Postgres service)
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/civil
      # Point to the Redis service on the Compose network (not localhost)
      REDIS_URL: redis://redis:6379
      # Provide a default JWT secret; override in deployment via environment if desired
      JWT_SECRET: ${JWT_SECRET:-dev_secret}
    # Do not publish API to host; Nginx proxies to it via internal network
    depends_on: [postgres, redis]
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://localhost:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\" "]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  worker:
    profiles: [app]
    build:
      context: .
      dockerfile: ./apps/worker/Dockerfile
    environment:
      # Worker currently only needs Redis
      REDIS_URL: redis://redis:6379
      LOG_LEVEL: info
    depends_on: [redis, postgres]

  web:
    profiles: [app]
    build:
      context: .
      dockerfile: ./apps/web/Dockerfile
    environment:
      # Use relative path so it works behind Nginx and Cloudflare
      NEXT_PUBLIC_API_BASE: /api
      # Optional base URL for absolute links (can be overridden in env)
      NEXT_PUBLIC_BASE_URL: http://localhost
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://localhost:3001').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\" "]
      interval: 10s
      timeout: 5s
      retries: 5

  postgres:
    profiles: [infra]
    image: postgres:16-alpine
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: civil
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    profiles: [infra]
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes", "--appendfsync", "everysec"]
    volumes:
      - redisdata:/data

volumes:
  pgdata:
  redisdata:
