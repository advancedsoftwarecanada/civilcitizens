services:
  nginx:
    image: nginx:1.25-alpine
    profiles: [app]
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      default: {}
      public_proxy:
        aliases:
          - civil_prod_nginx
    volumes:
      - ./ops/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ../ssl:/etc/nginx/ssl:ro
      - ../ssl/acme-challenge:/var/www/certbot:ro
      - /home/andre/sites/wp_advancedsoftware:/var/www/advancedsoftware_wp:ro
      - /home/andre/civilcitizens/static-sites/civil-citizens-for-canada-party/dist:/var/www/civilcitizenscanada:ro
    ports:
      - "${NGINX_HTTP_PORT:-80}:80"
      - "${NGINX_HTTPS_PORT:-443}:443"
    healthcheck:
      test: ["CMD-SHELL", "wget --header='Host: localhost' -qO- http://127.0.0.1/nginx-health >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    depends_on:
      api:
        condition: service_healthy
      web:
        condition: service_healthy

  api:
    profiles: [app]
    build:
      context: .
      dockerfile: ./apps/api/Dockerfile
    environment:
      # Required: Prisma database URL (uses local Postgres service)
      DATABASE_URL: ${DATABASE_URL:-postgresql://postgres:postgres@postgres:5432/civil}
      PRISMA_SKIP_MIGRATE: ${PRISMA_SKIP_MIGRATE:-0}
      # Point to the Redis service on the Compose network (not localhost)
      REDIS_URL: redis://redis:6379
      # Provide a default JWT secret; override in deployment via environment if desired
      JWT_SECRET: ${JWT_SECRET:-dev_secret}
      WORKER_INTERNAL_SECRET: ${WORKER_INTERNAL_SECRET:-dev_internal_worker_secret}
      MEDIA_S3_ENDPOINT: ${MEDIA_S3_ENDPOINT:-http://minio:9000}
      MEDIA_S3_BROWSER_ENDPOINT: ${MEDIA_S3_BROWSER_ENDPOINT:-}
      MEDIA_S3_REGION: ${MEDIA_S3_REGION:-us-east-1}
      MEDIA_S3_ACCESS_KEY: ${MEDIA_S3_ACCESS_KEY:-minioadmin}
      MEDIA_S3_SECRET_KEY: ${MEDIA_S3_SECRET_KEY:-minioadmin}
      MEDIA_BUCKET_PUBLIC: ${MEDIA_BUCKET_PUBLIC:-civil-media}
      MEDIA_BUCKET_ORIGINAL: ${MEDIA_BUCKET_ORIGINAL:-civil-media-raw}
      MEDIA_PUBLIC_BASE_URL: ${MEDIA_PUBLIC_BASE_URL:-https://${CIVIL_PUBLIC_HOST:-dev.civilcitizens.ca}/media}
      MEDIA_SIGNED_URL_TTL_SECONDS: ${MEDIA_SIGNED_URL_TTL_SECONDS:-900}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      STRIPE_PRICE_PREMIUM_MONTHLY: ${STRIPE_PRICE_PREMIUM_MONTHLY:-}
      STRIPE_PRICE_BUSINESS_MONTHLY: ${STRIPE_PRICE_BUSINESS_MONTHLY:-}
      STRIPE_PUBLIC_KEY: ${STRIPE_PUBLIC_KEY:-${NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY:-}}
      BILLING_RETURN_URL: ${BILLING_RETURN_URL:-}
      # Web Push (VAPID)
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-}
      VAPID_SUBJECT: ${VAPID_SUBJECT:-}
      # Mobile push (APNs delivery via standalone service)
      PUSH_REGISTER_SECRET: ${PUSH_REGISTER_SECRET:-}
      PUSH_ADMIN_SECRET: ${PUSH_ADMIN_SECRET:-}
      PUSH_DELIVERY_URL: ${PUSH_DELIVERY_URL:-http://push:8787}
      # Meeting RTC signaling service
      MEETING_RTC_SERVICE_URL: ${MEETING_RTC_SERVICE_URL:-http://meeting-rtc:8788}
      MEETING_RTC_SERVICE_SECRET: ${MEETING_RTC_SERVICE_SECRET:-}
      MEETING_RTC_REQUEST_TIMEOUT_MS: ${MEETING_RTC_REQUEST_TIMEOUT_MS:-8000}
      CIVIL_AI_DATA_KEY: ${CIVIL_AI_DATA_KEY:-}
      CIVIL_AI_SERVER_ID: ${CIVIL_AI_SERVER_ID:-}
      CIVIL_AI_SERVER_NAME: ${CIVIL_AI_SERVER_NAME:-}
      CIVIL_AI_BASE_URL: ${CIVIL_AI_BASE_URL:-}
      CIVIL_AI_PROVIDER: ${CIVIL_AI_PROVIDER:-}
      CIVIL_AI_API_KEY: ${CIVIL_AI_API_KEY:-}
      CIVIL_AI_MODEL: ${CIVIL_AI_MODEL:-}
      CIVIL_AI_API_VERSION: ${CIVIL_AI_API_VERSION:-}
      CIVIL_AI_SERVERS_FILE: ${CIVIL_AI_SERVERS_FILE:-}
      CIVIL_AI_INSTRUCTIONS_FILE: ${CIVIL_AI_INSTRUCTIONS_FILE:-}
      CIVIL_AI_JOB_TIMEOUT_MS: ${CIVIL_AI_JOB_TIMEOUT_MS:-}
      CIVIL_ENV_LABEL: ${CIVIL_ENV_LABEL:-}
      CIVIL_ENV_PRIMARY: ${CIVIL_ENV_PRIMARY:-}
      CIVIL_ENV_FILES: ${CIVIL_ENV_FILES:-}
      CIVIL_ADMIN_EMAILS: ${CIVIL_ADMIN_EMAILS:-}
      NOMINATIM_SERVER: ${NOMINATIM_SERVER:-http://nominatim:8080}
      MAP_TILE_SERVER: ${MAP_TILE_SERVER:-http://tileserver-gl:8080}
      OSRM_SERVER: ${OSRM_SERVER:-http://osrm:5000}
    # Do not publish API to host; Nginx proxies to it via internal network
    depends_on: [postgres, redis, meeting-rtc]
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://localhost:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\" "]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20m

  push:
    profiles: [app]
    build:
      context: ../builds/push/apns-service
      dockerfile: Dockerfile
    environment:
      PORT: 8787
      # Where to find the APNs AuthKey .p8 inside the container.
      APNS_KEY_PATH: /run/apns/${APNS_KEY_FILENAME:-AuthKey.p8}
      APNS_KEY_ID: ${APNS_KEY_ID:-}
      APNS_TEAM_ID: ${APNS_TEAM_ID:-}
      APNS_BUNDLE_ID: ${APNS_BUNDLE_ID:-}
      APNS_USE_SANDBOX: ${APNS_USE_SANDBOX:-false}
      FCM_PROJECT_ID: ${FCM_PROJECT_ID:-}
      FCM_CLIENT_EMAIL: ${FCM_CLIENT_EMAIL:-}
      FCM_PRIVATE_KEY: ${FCM_PRIVATE_KEY:-}
      FCM_SERVICE_ACCOUNT_JSON: ${FCM_SERVICE_ACCOUNT_JSON:-}
      # Optional auth on the push service endpoints
      PUSH_REGISTER_SECRET: ${PUSH_REGISTER_SECRET:-}
      PUSH_ADMIN_SECRET: ${PUSH_ADMIN_SECRET:-}
      # Optional: if you want to persist device tokens for /register inside the container
      DEVICE_STORE_PATH: /data/devices.json
    volumes:
      # Mount a host directory containing the AuthKey .p8.
      # Example: APNS_KEY_DIR=/opt/civil/secrets/apns and APNS_KEY_FILENAME=AuthKey_XXXX.p8
      - ${APNS_KEY_DIR:-./secrets/apns}:/run/apns:ro
      - pushdata:/data
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://localhost:8787/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\" "]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  meeting-rtc:
    profiles: [app]
    build:
      context: ../builds/meetings/rtc-service
      dockerfile: Dockerfile
    environment:
      PORT: 8788
      MEETING_RTC_SECRET: ${MEETING_RTC_SERVICE_SECRET:-}
      RTC_WS_URL: ${MEETING_RTC_WS_URL:-}
      RTC_WS_PATH: ${MEETING_RTC_WS_PATH:-/v1/ws}
      RTC_SESSION_TTL_SECONDS: ${MEETING_RTC_SESSION_TTL_SECONDS:-1800}
      RTC_HEARTBEAT_INTERVAL_MS: ${MEETING_RTC_HEARTBEAT_INTERVAL_MS:-30000}
      RTC_ICE_SERVERS_JSON: ${MEETING_RTC_ICE_SERVERS_JSON:-}
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://localhost:8788/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\" "]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  # STUN/TURN relay for WebRTC NAT traversal. Ports are published explicitly
  # (not network_mode: host) because this stack runs under Docker Desktop,
  # where host networking is scoped to the Desktop VM and isn't reachable
  # from outside without published ports. nginx/Cloudflare cannot proxy this
  # traffic - clients connect directly to TURN_EXTERNAL_IP:3478.
  turn:
    profiles: [app]
    image: coturn/coturn:4.6.2
    restart: unless-stopped
    ports:
      - "3478:3478/tcp"
      - "3478:3478/udp"
      - "${TURN_MIN_PORT:-49160}-${TURN_MAX_PORT:-49200}:${TURN_MIN_PORT:-49160}-${TURN_MAX_PORT:-49200}/udp"
      - "${TURN_MIN_PORT:-49160}-${TURN_MAX_PORT:-49200}:${TURN_MIN_PORT:-49160}-${TURN_MAX_PORT:-49200}/tcp"
    command:
      - "-n"
      - "--log-file=stdout"
      - "--listening-port=3478"
      - "--min-port=${TURN_MIN_PORT:-49160}"
      - "--max-port=${TURN_MAX_PORT:-49200}"
      - "--realm=${TURN_REALM:-civilcitizens.ca}"
      - "--user=${TURN_USERNAME:-civil-prod-turn}:${TURN_PASSWORD:-changeme}"
      - "--lt-cred-mech"
      - "--fingerprint"
      - "--no-multicast-peers"
      - "--external-ip=${TURN_EXTERNAL_IP:-}"
      - "--no-cli"

  worker:
    profiles: [app]
    build:
      context: .
      dockerfile: ./apps/worker/Dockerfile
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://postgres:postgres@postgres:5432/civil}
      # Worker currently only needs Redis
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
      INTERNAL_API_BASE_URL: ${INTERNAL_API_BASE_URL:-http://api:3000}
      WORKER_INTERNAL_SECRET: ${WORKER_INTERNAL_SECRET:-dev_internal_worker_secret}
      LOG_LEVEL: info
      MEDIA_S3_ENDPOINT: ${MEDIA_S3_ENDPOINT:-http://minio:9000}
      MEDIA_S3_REGION: ${MEDIA_S3_REGION:-us-east-1}
      MEDIA_S3_ACCESS_KEY: ${MEDIA_S3_ACCESS_KEY:-minioadmin}
      MEDIA_S3_SECRET_KEY: ${MEDIA_S3_SECRET_KEY:-minioadmin}
      MEDIA_BUCKET_PUBLIC: ${MEDIA_BUCKET_PUBLIC:-civil-media}
      MEDIA_BUCKET_ORIGINAL: ${MEDIA_BUCKET_ORIGINAL:-civil-media-raw}
      MEDIA_PUBLIC_BASE_URL: ${MEDIA_PUBLIC_BASE_URL:-https://${CIVIL_PUBLIC_HOST:-dev.civilcitizens.ca}/media}
      CIVIL_AI_SERVER_ID: ${CIVIL_AI_SERVER_ID:-}
      CIVIL_AI_SERVER_NAME: ${CIVIL_AI_SERVER_NAME:-}
      CIVIL_AI_BASE_URL: ${CIVIL_AI_BASE_URL:-}
      CIVIL_AI_PROVIDER: ${CIVIL_AI_PROVIDER:-}
      CIVIL_AI_API_KEY: ${CIVIL_AI_API_KEY:-}
      CIVIL_AI_MODEL: ${CIVIL_AI_MODEL:-}
      CIVIL_AI_API_VERSION: ${CIVIL_AI_API_VERSION:-}
      CIVIL_AI_SERVERS_FILE: ${CIVIL_AI_SERVERS_FILE:-}
      CIVIL_AI_INSTRUCTIONS_FILE: ${CIVIL_AI_INSTRUCTIONS_FILE:-}
      CIVIL_AI_VISION_MODEL: ${CIVIL_AI_VISION_MODEL:-}
    volumes:
      - ./ai_servers.json:/app/ai_servers.json:ro
      - ./CIVIL_AI.md:/app/CIVIL_AI.md:ro
    depends_on: [redis, postgres]

  web:
    profiles: [app]
    build:
      context: .
      dockerfile: ./apps/web/Dockerfile
      args:
        NEXT_PUBLIC_GTAG_ID: ${NEXT_PUBLIC_GTAG_ID:-}
    environment:
      # Allow overriding via env files per environment
      NEXT_PUBLIC_API_BASE: ${NEXT_PUBLIC_API_BASE:-/api}
      NEXT_PUBLIC_BASE_URL: ${NEXT_PUBLIC_BASE_URL:-https://${CIVIL_PUBLIC_HOST:-dev.civilcitizens.ca}}
      NEXT_PUBLIC_MEDIA_BASE_URL: ${NEXT_PUBLIC_MEDIA_BASE_URL:-https://${CIVIL_PUBLIC_HOST:-dev.civilcitizens.ca}/media}
      NEXT_PUBLIC_GTAG_ID: ${NEXT_PUBLIC_GTAG_ID:-}
      NOMINATIM_SERVER: ${NOMINATIM_SERVER:-http://nominatim:8080}
      MAP_TILE_SERVER: ${MAP_TILE_SERVER:-http://tileserver-gl:8080}
      OSRM_SERVER: ${OSRM_SERVER:-http://osrm:5000}
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://localhost:3001').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\" "]
      interval: 10s
      timeout: 5s
      retries: 5

  postgres:
    profiles: [infra]
    image: postgis/postgis:16-3.4-alpine
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: civil
    volumes:
      - ${POSTGRES_DATA_DIR:-pgdata}:/var/lib/postgresql/data
    ports:
      - "${POSTGRES_HOST_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d civil"]
      interval: 10s
      timeout: 5s
      retries: 5

  postgres-gis-shadow:
    profiles: [shadow-infra]
    image: postgis/postgis:16-3.4-alpine
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_GIS_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_GIS_DB:-civil}
    volumes:
      - ${POSTGRES_GIS_DATA_DIR:-pgdata_gis_shadow}:/var/lib/postgresql/data
    ports:
      - "${POSTGRES_GIS_HOST_PORT:-5743}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ${POSTGRES_GIS_DB:-civil}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    profiles: [infra]
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes", "--appendfsync", "everysec"]
    volumes:
      - ${REDIS_DATA_DIR:-redisdata}:/data
    ports:
      - "${REDIS_HOST_PORT:-6379}:6379"

  minio:
    profiles: [infra]
    image: minio/minio:latest
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${MEDIA_S3_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MEDIA_S3_SECRET_KEY:-minioadmin}
    volumes:
      - ${MINIO_DATA_DIR:-miniostorage}:/data
    ports:
      - "${MINIO_HOST_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_HOST_PORT:-9001}:9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio-setup:
    profiles: [infra]
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >-
      /bin/sh -c "
      mc alias set local http://minio:9000 ${MEDIA_S3_ACCESS_KEY:-minioadmin} ${MEDIA_S3_SECRET_KEY:-minioadmin} &&
      mc mb --ignore-existing local/${MEDIA_BUCKET_PUBLIC:-civil-media} &&
      mc mb --ignore-existing local/${MEDIA_BUCKET_ORIGINAL:-civil-media-raw} &&
      mc anonymous set download local/${MEDIA_BUCKET_PUBLIC:-civil-media}
      "
    restart: "no"

volumes:
  pgdata:
  pgdata_gis_shadow:
  redisdata:
  miniostorage:
  pushdata:

networks:
  public_proxy:
    external: true
    name: public_proxy
