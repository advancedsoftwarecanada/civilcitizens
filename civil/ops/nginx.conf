server {
  listen 80;
  server_name maplerides.ca www.maplerides.ca dev.maplerides.ca _;

  set $civil_ai_upstream host.docker.internal:1234;
  set $nominatim_upstream nominatim:8080;
  set $osrm_upstream osrm:5000;

  # Accept larger uploads
  client_max_body_size 2g;

  if ($redirect_public_http_to_https = 1) {
    return 301 https://$host$request_uri;
  }

  location = /nominatim {
    if ($maps_and_rtc_host_allowed = 0) {
      return 403;
    }
    return 301 /nominatim/;
  }

  location /nominatim/ {
    if ($maps_and_rtc_host_allowed = 0) {
      return 403;
    }
    rewrite ^/nominatim/(.*)$ /$1 break;
    proxy_pass http://$nominatim_upstream;
    proxy_http_version 1.1;
    proxy_read_timeout 600s;
    proxy_send_timeout 600s;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $client_real_ip;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Proto $cf_forwarded_proto;
    proxy_set_header X-Forwarded-Port $forwarded_port;
  }

  location = /osrm {
    if ($maps_and_rtc_host_allowed = 0) {
      return 403;
    }
    return 301 /osrm/;
  }

  location /osrm/ {
    if ($maps_and_rtc_host_allowed = 0) {
      return 403;
    }
    rewrite ^/osrm/(.*)$ /$1 break;
    proxy_pass http://$osrm_upstream;
    proxy_http_version 1.1;
    proxy_read_timeout 600s;
    proxy_send_timeout 600s;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $client_real_ip;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Proto $cf_forwarded_proto;
    proxy_set_header X-Forwarded-Port $forwarded_port;
  }

  location /v1/ {
    proxy_pass http://$civil_ai_upstream;
    proxy_http_version 1.1;
    proxy_buffering off;
    proxy_request_buffering off;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
    add_header X-Accel-Buffering no;

    proxy_set_header Host $civil_ai_upstream;
    proxy_set_header X-Real-IP $client_real_ip;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Proto $cf_forwarded_proto;
    proxy_set_header X-Forwarded-Port $forwarded_port;
  }

  # web at /
  location / {
    proxy_pass http://web:3001;
    proxy_http_version 1.1;
    # websocket support (Next.js dev/HMR, future features)
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;

    # Forwarded headers (preserve Cloudflare info)
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $client_real_ip;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Proto $cf_forwarded_proto;
    proxy_set_header X-Forwarded-Port $forwarded_port;

    proxy_read_timeout 600s;
    proxy_send_timeout 600s;
  }

  # simple health for container checks
  location = /nginx-health {
    add_header Content-Type text/plain;
    return 200 'ok';
  }

  # api at /api (includes SSE/websocket-friendly settings)
  location /api/ {
    proxy_pass http://api:3000/;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;

    # Long-lived connections & streaming (SSE)
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
    proxy_request_buffering off;
    proxy_buffering off;
    add_header X-Accel-Buffering no;

    # Forwarded headers for app logic and logs
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $client_real_ip;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Proto $cf_forwarded_proto;
    proxy_set_header X-Forwarded-Port $forwarded_port;
    proxy_next_upstream error timeout http_502 http_503 http_504;
  }

  # meeting rtc signaling at /rtc
  # trailing slash matters here so /rtc/v1/ws becomes /v1/ws upstream
  location /rtc/ {
    if ($maps_and_rtc_host_allowed = 0) {
      return 403;
    }
    proxy_pass http://meeting-rtc:8788/;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;

    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
    proxy_buffering off;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $client_real_ip;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Proto $cf_forwarded_proto;
    proxy_set_header X-Forwarded-Port $forwarded_port;
  }

  location = /maps {
    if ($maps_and_rtc_host_allowed = 0) {
      return 403;
    }
    proxy_pass http://web:3001;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $client_real_ip;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Proto $cf_forwarded_proto;
    proxy_set_header X-Forwarded-Port $forwarded_port;
    proxy_read_timeout 600s;
    proxy_send_timeout 600s;
  }

  location /maps/ {
    if ($maps_and_rtc_host_allowed = 0) {
      return 403;
    }
    proxy_pass http://web:3001;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $client_real_ip;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Proto $cf_forwarded_proto;
    proxy_set_header X-Forwarded-Port $forwarded_port;
    proxy_read_timeout 600s;
    proxy_send_timeout 600s;
  }

  # media bucket proxy so public URLs stay on the same origin (https)
  location /media/ {
    proxy_pass http://minio:9000/civil-media/;
    proxy_http_version 1.1;
    proxy_set_header Host minio:9000;
    proxy_set_header X-Real-IP $client_real_ip;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Proto $cf_forwarded_proto;
    proxy_set_header X-Forwarded-Port $forwarded_port;
  }
}

