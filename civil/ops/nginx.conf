resolver 127.0.0.11 ipv6=off valid=30s;

server {
  listen 80;
  server_name _;

  # Respect Cloudflare Flexible SSL: redirect only when CF says proto=http to avoid loops
  if ($http_x_forwarded_proto = "http") {
    return 301 https://$host$request_uri;
  }

  # Accept larger uploads (matches previous Meteor setup)
  client_max_body_size 20m;

  # web at /
  location / {
    proxy_pass http://web:3001;
    proxy_http_version 1.1;
    # websocket support (Next.js dev/HMR, future features)
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";

    # Forwarded headers
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $http_cf_connecting_ip;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    proxy_set_header X-Forwarded-Port $server_port;
  }

  # simple health for container checks
  location = /nginx-health {
    add_header Content-Type text/plain;
    return 200 'ok';
  }

  # api at /api (includes SSE/websocket-friendly settings)
  location /api/ {
    proxy_pass http://api:3000/;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";

    # Long-lived connections & streaming (SSE)
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
    proxy_buffering off;
    add_header X-Accel-Buffering no;

    # Forwarded headers for app logic and logs
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $http_cf_connecting_ip;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    proxy_set_header X-Forwarded-Port $server_port;
    proxy_next_upstream error timeout http_502 http_503 http_504;
  }
}

# HTTPS listener for Cloudflare Full/Strict origin pulls
server {
  listen 443 ssl;
  http2 on;
  server_name _;

  ssl_certificate     /etc/nginx/ssl/origin_cert.pem;
  ssl_certificate_key /etc/nginx/ssl/private_key;

  client_max_body_size 20m;

  location / {
    proxy_pass http://web:3001;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $http_cf_connecting_ip;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-Port 443;
  }

  location /api/ {
    proxy_pass http://api:3000/;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";

    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
    proxy_buffering off;
    add_header X-Accel-Buffering no;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $http_cf_connecting_ip;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-Port 443;
    proxy_next_upstream error timeout http_502 http_503 http_504;
  }

  # simple health for container checks (HTTPS)
  location = /nginx-health {
    add_header Content-Type text/plain;
    return 200 'ok';
  }
}
