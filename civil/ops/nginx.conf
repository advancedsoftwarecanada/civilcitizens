resolver 127.0.0.11 ipv6=off valid=30s;

server {
  listen 80;
  server_name civilcitizens.ca www.civilcitizens.ca dev.civilcitizens.ca _;

  # Accept larger uploads
  client_max_body_size 250m;

  # web at /
  location / {
    proxy_pass http://web:3001;
    proxy_http_version 1.1;
    # websocket support (Next.js dev/HMR, future features)
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";

    # Forwarded headers (preserve Cloudflare info)
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $http_cf_connecting_ip;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Proto http;
    proxy_set_header X-Forwarded-Port 80;
  }

  # simple health for container checks
  location = /nginx-health {
    add_header Content-Type text/plain;
    return 200 'ok';
  }

  # api at /api (includes SSE/websocket-friendly settings)
  location /api/ {
    proxy_pass http://api:3000/;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";

    # Long-lived connections & streaming (SSE)
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
    proxy_buffering off;
    add_header X-Accel-Buffering no;

    # Forwarded headers for app logic and logs
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $http_cf_connecting_ip;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Proto http;
    proxy_set_header X-Forwarded-Port 80;
    proxy_next_upstream error timeout http_502 http_503 http_504;
  }

  # media bucket proxy so public URLs stay on the same origin (https)
  location /media/ {
    proxy_pass http://minio:9000/civil-media/;
    proxy_http_version 1.1;
    proxy_set_header Host minio:9000;
    proxy_set_header X-Real-IP $http_cf_connecting_ip;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Proto http;
    proxy_set_header X-Forwarded-Port 80;
  }
}
