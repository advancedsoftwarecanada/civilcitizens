resolver 127.0.0.11 ipv6=off valid=30s;

map $http_origin $uploads_cors_origin {
  default "";
  "~^https://(www\.)?maplerides\.ca$" $http_origin;
  "~^https://dev\.maplerides\.ca$" $http_origin;
}

map $http_upgrade $connection_upgrade {
  default upgrade;
  '' close;
}

map $http_cf_connecting_ip $client_real_ip {
  default $http_cf_connecting_ip;
  '' $remote_addr;
}

map $http_x_forwarded_proto $forwarded_proto {
  default $http_x_forwarded_proto;
  '' $scheme;
}

map $http_cf_visitor $cf_forwarded_proto {
  default $forwarded_proto;
  ~*"scheme":"https" https;
}

map $cf_forwarded_proto $forwarded_port {
  https 443;
  default 80;
}

map $cf_forwarded_proto $fastcgi_https {
  https on;
  default "";
}

map $host $maps_and_rtc_host_allowed {
  default 0;
  maplerides.ca 1;
  www.maplerides.ca 1;
  dev.maplerides.ca 1;
}

map "$cf_forwarded_proto:$host" $redirect_public_http_to_https {
  default 0;
  "http:civilcitizens.ca" 1;
  "http:www.civilcitizens.ca" 1;
  "http:dev.civilcitizens.ca" 1;
}

server {
  listen 80;
  server_name uploads.maplerides.ca uploads.dev.maplerides.ca;

  client_max_body_size 2g;

  add_header Access-Control-Allow-Origin $uploads_cors_origin always;
  add_header Access-Control-Allow-Methods "PUT, OPTIONS" always;
  add_header Access-Control-Allow-Headers "Content-Type, x-amz-acl, x-amz-content-sha256, x-amz-date, x-amz-security-token" always;
  add_header Access-Control-Max-Age 86400 always;
  add_header Access-Control-Expose-Headers "ETag" always;

  location ^~ /.well-known/acme-challenge/ {
    root /var/www/certbot;
    default_type text/plain;
    try_files $uri =404;
  }

  location / {
    if ($request_method = OPTIONS) {
      return 204;
    }

    proxy_pass http://minio:9000;
    proxy_http_version 1.1;
    proxy_request_buffering off;
    proxy_buffering off;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
    proxy_hide_header Access-Control-Allow-Credentials;
    proxy_hide_header Access-Control-Allow-Origin;
    proxy_hide_header Access-Control-Allow-Methods;
    proxy_hide_header Access-Control-Allow-Headers;
    proxy_hide_header Access-Control-Max-Age;
    proxy_hide_header Access-Control-Expose-Headers;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $client_real_ip;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Proto $cf_forwarded_proto;
    proxy_set_header X-Forwarded-Port $forwarded_port;
  }
}

server {
  listen 80;
  server_name www.andrewnormore.ca andynormore.ca www.andynormore.ca;
  return 301 https://andrewnormore.ca$request_uri;
}

server {
  listen 80;
  server_name www.civilcitizenscanada.ca;
  return 301 https://civilcitizenscanada.ca$request_uri;
}

server {
  listen 80;
  server_name civilcitizenscanada.ca;

  root /var/www/civilcitizenscanada;
  index index.html;

  location = /nginx-health {
    access_log off;
    return 200 "ok\n";
  }

  location = /robots.txt {
    try_files $uri =404;
    access_log off;
    log_not_found off;
  }

  location = /sitemap.xml {
    try_files $uri =404;
    access_log off;
  }

  location ~* \.(?:css|js|jpg|jpeg|gif|png|svg|ico|webp|woff|woff2|ttf|eot)$ {
    try_files $uri =404;
    expires 7d;
    access_log off;
    log_not_found off;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}

server {
  listen 80;
  server_name andrewnormore.ca;

  resolver 127.0.0.11 ipv6=off valid=30s;
  set $andrewnormore_php_upstream advancedsoftware-php:9000;

  root /var/www/advancedsoftware_wp;
  index index.php index.html;
  client_max_body_size 64m;

  location = /wp-admin {
    return 301 https://$host/wp-admin/;
  }

  location / {
    try_files $uri $uri/ /index.php?$args;
  }

  location ~ \.php$ {
    include fastcgi_params;
    fastcgi_split_path_info ^(.+\.php)(/.+)$;
    fastcgi_pass $andrewnormore_php_upstream;
    fastcgi_param SCRIPT_FILENAME /var/www/html$fastcgi_script_name;
    fastcgi_param DOCUMENT_ROOT /var/www/html;
    fastcgi_param PATH_INFO $fastcgi_path_info;
    fastcgi_param HTTPS $fastcgi_https;
    fastcgi_param HTTP_X_FORWARDED_PROTO $cf_forwarded_proto;
    fastcgi_param HTTP_X_FORWARDED_HOST $host;
    fastcgi_param HTTP_X_FORWARDED_PORT $forwarded_port;
    fastcgi_buffers 16 16k;
    fastcgi_buffer_size 32k;
    fastcgi_connect_timeout 60s;
    fastcgi_send_timeout 300s;
    fastcgi_read_timeout 300s;
  }

  location ~* \.(?:css|js|jpg|jpeg|gif|png|svg|ico|webp|woff|woff2|ttf|eot)$ {
    expires 7d;
    log_not_found off;
  }

  location = /favicon.ico { access_log off; log_not_found off; }
  location = /robots.txt { access_log off; log_not_found off; }

  location ~* \.(?:htaccess|php~|php\.swp|sql)$ {
    deny all;
  }
}

