name: Deploy Application

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Debug Secrets
      run: |
        echo "Host: ${{ secrets.SERVER_HOST }}"
        echo "User: ${{ secrets.SERVER_USER }}"

    - name: Connect to Server and Deploy
      uses: appleboy/ssh-action@master
      with:
        host: ${{ secrets.SERVER_HOST }}
        username: ${{ secrets.SERVER_USER }}
        key: ${{ secrets.SSH_PRIVATE_KEY }}
        script: |
          export NVM_DIR="$HOME/.nvm"
          [ -s "$NVM_DIR/nvm.sh" ] && \. "$NVM_DIR/nvm.sh"  # This loads nvm
          nvm use v18.16.0  # Explicitly use the correct Node.js version
          export PATH=$PATH:$NVM_DIR/versions/node/v18.16.0/bin
          cd /home/asecc/build
          ./stop.sh
          ./update.sh
          ./start.sh

    - name: Deployment Completed
      run: echo "Deployment process finished successfully."