name: Deploy Civil (API/Web/Worker)

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Package deploy artifacts (civil directory)
      run: |
        tar czf civil-bundle.tgz -C civil .

    - name: Upload bundle to server
      uses: appleboy/scp-action@master
      with:
        host: ${{ secrets.SERVER_HOST }}
        username: ${{ secrets.SERVER_USER }}
        key: ${{ secrets.SSH_PRIVATE_KEY }}
        source: "civil-bundle.tgz"
        target: "~"

    - name: Connect to Server and Deploy
      uses: appleboy/ssh-action@master
      with:
        host: ${{ secrets.SERVER_HOST }}
        username: ${{ secrets.SERVER_USER }}
        key: ${{ secrets.SSH_PRIVATE_KEY }}
        script: |
          set -euo pipefail
          mkdir -p ~/civil-citizens/civil
          # Unpack the uploaded bundle into the target directory
          tar xzf ~/civil-bundle.tgz -C ~/civil-citizens/civil
          # Ensure infra (Postgres/Redis) is up first using compose file in civil/
          docker compose -f ~/civil-citizens/civil/docker-compose.yml --profile infra up -d
          # Build and restart app stack (keeps infra volumes)
          docker compose -f ~/civil-citizens/civil/docker-compose.yml --profile app build
          docker compose -f ~/civil-citizens/civil/docker-compose.yml --profile app up -d
          # Optional: show status
          docker compose -f ~/civil-citizens/civil/docker-compose.yml ps

    - name: Done
      run: echo "Deployment process finished successfully."