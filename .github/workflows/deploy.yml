name: Deploy Civil (API/Web/Worker)

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Prepare server target directory (clean)
      uses: appleboy/ssh-action@master
      with:
        host: ${{ secrets.SERVER_HOST }}
        username: ${{ secrets.SERVER_USER }}
        key: ${{ secrets.SSH_PRIVATE_KEY }}
        script: |
          set -euo pipefail
          rm -rf ~/civil-citizens/civil || true
          mkdir -p ~/civil-citizens/civil

    - name: Upload bundle to server
      uses: appleboy/scp-action@master
      with:
        host: ${{ secrets.SERVER_HOST }}
        username: ${{ secrets.SERVER_USER }}
        key: ${{ secrets.SSH_PRIVATE_KEY }}
        source: "civil/*"
        target: "~/civil-citizens/civil"

    - name: Connect to Server and Deploy
      uses: appleboy/ssh-action@master
      with:
        host: ${{ secrets.SERVER_HOST }}
        username: ${{ secrets.SERVER_USER }}
        key: ${{ secrets.SSH_PRIVATE_KEY }}
        script: |
          set -euo pipefail
          # Files are already extracted to ~/civil-citizens/civil by the SCP step
          # Ensure infra (Postgres/Redis) is up first using compose file in civil/
          docker compose -f ~/civil-citizens/civil/docker-compose.yml --profile infra up -d
          # Build and restart full stack (include both profiles so worker can see redis)
          docker compose -f ~/civil-citizens/civil/docker-compose.yml --profile infra --profile app build --no-cache
          docker compose -f ~/civil-citizens/civil/docker-compose.yml --profile infra --profile app up -d
          # Optional: show status
          docker compose -f ~/civil-citizens/civil/docker-compose.yml ps

    - name: Done
      run: echo "Deployment process finished successfully."