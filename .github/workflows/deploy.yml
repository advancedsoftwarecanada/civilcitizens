name: Deploy Civil (API/Web/Worker)

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Prepare server target directory (clean)
      uses: appleboy/ssh-action@master
      with:
        host: ${{ secrets.SERVER_HOST }}
        username: ${{ secrets.SERVER_USER }}
        key: ${{ secrets.SSH_PRIVATE_KEY }}
        script: |
          set -euo pipefail
          rm -rf ~/civil-citizens/civil || true
          mkdir -p ~/civil-citizens/civil

    - name: Upload bundle to server
      uses: appleboy/scp-action@master
      with:
        host: ${{ secrets.SERVER_HOST }}
        username: ${{ secrets.SERVER_USER }}
        key: ${{ secrets.SSH_PRIVATE_KEY }}
        source: "civil/*"
        target: "~/civil-citizens/civil"

    - name: Connect to Server and Deploy
      uses: appleboy/ssh-action@master
      with:
        host: ${{ secrets.SERVER_HOST }}
        username: ${{ secrets.SERVER_USER }}
        key: ${{ secrets.SSH_PRIVATE_KEY }}
        script: |
          set -euo pipefail
          # Files are already extracted to ~/civil-citizens/civil by the SCP step
          echo "Listing target directory before deploy:"
          ls -la "$HOME/civil-citizens/civil" || true
          echo "Finding docker-compose.yml under $HOME/civil-citizens/civil ..."
          COMPOSE_FILE=$(find "$HOME/civil-citizens/civil" -maxdepth 2 -type f -name 'docker-compose.yml' | head -n1 || true)
          if [ -z "${COMPOSE_FILE:-}" ]; then
            echo "ERROR: docker-compose.yml not found under $HOME/civil-citizens/civil"
            echo "Tree of target dir for debugging:" && ls -laR "$HOME/civil-citizens/civil" || true
            exit 1
          fi
          echo "Using compose file: $COMPOSE_FILE"

          echo "Stopping any existing Civil stack (down + remove-orphans) ..."
          docker compose -f "$COMPOSE_FILE" --profile infra --profile app down --remove-orphans || true

          echo "Checking and stopping any containers occupying ports 80/443 ..."
          PORT80_CONTAINERS=$(docker ps --filter 'publish=80' -q || true)
          PORT443_CONTAINERS=$(docker ps --filter 'publish=443' -q || true)
          if [ -n "${PORT80_CONTAINERS}${PORT443_CONTAINERS}" ]; then
            echo "Stopping containers on 80/443:"; echo "$PORT80_CONTAINERS" "$PORT443_CONTAINERS" | tr ' ' '\n' | sort -u
            echo "$PORT80_CONTAINERS $PORT443_CONTAINERS" | xargs -r docker stop || true
            echo "$PORT80_CONTAINERS $PORT443_CONTAINERS" | xargs -r docker rm || true
          else
            echo "No containers currently binding 80/443."
          fi

          # Ensure infra (Postgres/Redis) is up first
          docker compose -f "$COMPOSE_FILE" --profile infra up -d
          # Build and restart full stack (include both profiles so worker can see redis)
          docker compose -f "$COMPOSE_FILE" --profile infra --profile app build --no-cache
          docker compose -f "$COMPOSE_FILE" --profile infra --profile app up -d
          # Optional: show status
          docker compose -f "$COMPOSE_FILE" ps

    - name: Done
      run: echo "Deployment process finished successfully."