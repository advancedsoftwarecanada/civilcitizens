name: Deploy Civil (API/Web/Worker)

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Prepare server target directory (clean)
      uses: appleboy/ssh-action@master
      with:
        host: ${{ secrets.SERVER_HOST }}
        username: ${{ secrets.SERVER_USER }}
        key: ${{ secrets.SSH_PRIVATE_KEY }}
        script: |
          set -euo pipefail
          rm -rf ~/civil-citizens/civil || true
          mkdir -p ~/civil-citizens/civil

    - name: Upload bundle to server
      uses: appleboy/scp-action@master
      with:
        host: ${{ secrets.SERVER_HOST }}
        username: ${{ secrets.SERVER_USER }}
        key: ${{ secrets.SSH_PRIVATE_KEY }}
        source: "civil/*"
        target: "~/civil-citizens/civil"

    - name: Connect to Server and Deploy
      uses: appleboy/ssh-action@master
      with:
        host: ${{ secrets.SERVER_HOST }}
        username: ${{ secrets.SERVER_USER }}
        key: ${{ secrets.SSH_PRIVATE_KEY }}
        script: |
          set -euo pipefail
          # Files are already extracted to ~/civil-citizens/civil by the SCP step
          echo "Listing target directory before deploy:"
          ls -la "$HOME/civil-citizens/civil" || true
          echo "Finding docker-compose.yml under $HOME/civil-citizens/civil ..."
          COMPOSE_FILE=$(find "$HOME/civil-citizens/civil" -maxdepth 2 -type f -name 'docker-compose.yml' | head -n1 || true)
          if [ -z "${COMPOSE_FILE:-}" ]; then
            echo "ERROR: docker-compose.yml not found under $HOME/civil-citizens/civil"
            echo "Tree of target dir for debugging:" && ls -laR "$HOME/civil-citizens/civil" || true
            exit 1
          fi
          echo "Using compose file: $COMPOSE_FILE"

          echo "Stopping any existing Civil stack (down + remove-orphans) ..."
          docker compose -f "$COMPOSE_FILE" --profile infra --profile app down --remove-orphans || true
          # Ensure we never reuse alternate ports
          unset NGINX_HTTP_PORT NGINX_HTTPS_PORT || true

          echo "Checking and stopping any containers occupying ports 80/443 ..."
          PORT80_CONTAINERS=$(docker ps --filter 'publish=80' -q || true)
          PORT443_CONTAINERS=$(docker ps --filter 'publish=443' -q || true)
          if [ -n "${PORT80_CONTAINERS}${PORT443_CONTAINERS}" ]; then
            echo "Stopping containers on 80/443:"; echo "$PORT80_CONTAINERS" "$PORT443_CONTAINERS" | tr ' ' '\n' | sort -u
            echo "$PORT80_CONTAINERS $PORT443_CONTAINERS" | xargs -r docker stop || true
            echo "$PORT80_CONTAINERS $PORT443_CONTAINERS" | xargs -r docker rm || true
          else
            echo "No containers currently binding 80/443."
          fi

          echo "Detecting host-level listeners on ports 80/443 (non-Docker) ..."
          HTTP_IN_USE=$(ss -ltnp 2>/dev/null | awk '$4 ~ /:80$/ {print $0}' || true)
          HTTPS_IN_USE=$(ss -ltnp 2>/dev/null | awk '$4 ~ /:443$/ {print $0}' || true)
          if [ -n "$HTTP_IN_USE" ] && ! echo "$HTTP_IN_USE" | grep -q docker-proxy; then
            echo "ERROR: Port 80 is in use by a non-Docker process. Please free it (e.g., stop host nginx/apache) and re-run deploy."
            echo "$HTTP_IN_USE"
            exit 1
          fi
          if [ -n "$HTTPS_IN_USE" ] && ! echo "$HTTPS_IN_USE" | grep -q docker-proxy; then
            echo "ERROR: Port 443 is in use by a non-Docker process. Please free it and re-run deploy."
            echo "$HTTPS_IN_USE"
            exit 1
          fi

          # Ensure infra (Postgres/Redis) is up first
          docker compose -f "$COMPOSE_FILE" --profile infra up -d
          # Build and restart full stack (include both profiles so worker can see redis)
          docker compose -f "$COMPOSE_FILE" --profile infra --profile app build --no-cache
          docker compose -f "$COMPOSE_FILE" --profile infra --profile app up -d --force-recreate --remove-orphans
          # Optional: show status
          docker compose -f "$COMPOSE_FILE" ps

          echo "Locating api container ..."
          API_CID=""
          for cid in $(docker compose -f "$COMPOSE_FILE" ps -q || true); do
            svc=$(docker inspect -f '{{ index .Config.Labels "com.docker.compose.service" }}' "$cid" 2>/dev/null || echo "")
            if [ "$svc" = "api" ]; then
              API_CID="$cid"
              break
            fi
          done
          if [ -z "$API_CID" ]; then
            echo "ERROR: Could not determine api container ID (service 'api' missing?)." && exit 1
          fi

          echo "Waiting for API to become healthy ($API_CID) ..."
          for i in $(seq 1 40); do
            ASTATE=$(docker inspect -f '{{.State.Status}}' "$API_CID" 2>/dev/null || echo "")
            AHEALTH=$(docker inspect -f '{{.State.Health.Status}}' "$API_CID" 2>/dev/null || echo "")
            if [ "$ASTATE" = "running" ] && [ "$AHEALTH" = "healthy" ]; then
              echo "API is healthy."
              break
            fi
            if [ "$ASTATE" = "exited" ] || [ "$AHEALTH" = "unhealthy" ]; then
              echo "ERROR: API container state=$ASTATE health=$AHEALTH"
              echo "--- docker ps ---"; docker ps -a
              echo "--- api logs ---"; docker logs --tail=200 "$API_CID" || true
              exit 1
            fi
            sleep 2
          done
          ASTATE=$(docker inspect -f '{{.State.Status}}' "$API_CID" 2>/dev/null || echo "")
          AHEALTH=$(docker inspect -f '{{.State.Health.Status}}' "$API_CID" 2>/dev/null || echo "")
          if [ "$AHEALTH" != "healthy" ]; then
            echo "ERROR: API did not become healthy in time (state=$ASTATE health=$AHEALTH)."
            echo "--- api logs ---"; docker logs --tail=200 "$API_CID" || true
            exit 1
          fi

          echo "Locating nginx container ..."
          NGINX_CID=""
          for cid in $(docker compose -f "$COMPOSE_FILE" ps -q || true); do
            svc=$(docker inspect -f '{{ index .Config.Labels "com.docker.compose.service" }}' "$cid" 2>/dev/null || echo "")
            if [ "$svc" = "nginx" ]; then
              NGINX_CID="$cid"
              break
            fi
          done
          if [ -z "$NGINX_CID" ]; then
            echo "ERROR: Could not determine nginx container ID (service 'nginx' missing?)." && exit 1
          fi

          echo "Waiting for Nginx to become healthy ($NGINX_CID) ..."
          for i in $(seq 1 30); do
            STATUS=$(docker inspect -f '{{.State.Health.Status}}' "$NGINX_CID" 2>/dev/null || echo "")
            if [ "$STATUS" = "healthy" ]; then
              echo "Nginx is healthy."
              break
            fi
            sleep 2
          done
          STATUS=$(docker inspect -f '{{.State.Health.Status}}' "$NGINX_CID" 2>/dev/null || echo "")
          if [ "$STATUS" != "healthy" ]; then
            echo "ERROR: Nginx did not become healthy. Logs:"
            docker logs --tail=200 "$NGINX_CID" || true
            exit 1
          fi

          echo "Verifying ports 80 and 443 are listening ..."
          ss -ltnp | grep -E 'LISTEN.+:80\s' || (echo 'Port 80 not listening' && exit 1)
          ss -ltnp | grep -E 'LISTEN.+:443\s' || (echo 'Port 443 not listening' && exit 1)

    - name: Done
      run: echo "Deployment process finished successfully."